# ═══════════════════════════════════════════════════════════════════════════
# Build Windows — step-level Windows build + package (composite action)
# ═══════════════════════════════════════════════════════════════════════════
# Builds + packages NetDiagnostics for Windows:
#   input variant = static  (zero-DLL static Qt 6.11.1 source build)
#                  | dynamic (MSYS2 Qt6 packages + NSIS installer)
#
# The caller (build.yml) owns the jobs — one per variant (they need different
# timeouts: static 150 min vs dynamic 30 min) — plus the checkout.  Version/
# build inputs come from the caller's version job.
# ═══════════════════════════════════════════════════════════════════════════
name: Build Windows
description: Build + package NetDiagnostics for Windows (static zero-DLL or dynamic NSIS) and upload the artifact
inputs:
  variant:
    description: Build variant (static | dynamic)
    required: true
  pkg_version:
    description: Release version (M.m.p)
    required: true
  build_number:
    description: CI build number
    required: true
  git_hash:
    description: Commit SHA
    required: true
runs:
  using: composite
  steps:
    # ── MSYS2 setup (static: full toolchain + curl deps for the source build)
    - uses: msys2/setup-msys2@v2
      if: inputs.variant == 'static'
      with:
        msystem: ucrt64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-perl
          mingw-w64-ucrt-x86_64-python
          mingw-w64-ucrt-x86_64-pkg-config
          mingw-w64-ucrt-x86_64-openssl
          mingw-w64-ucrt-x86_64-zlib
          mingw-w64-ucrt-x86_64-brotli
          mingw-w64-ucrt-x86_64-pcre2
          mingw-w64-ucrt-x86_64-libb2
          mingw-w64-ucrt-x86_64-zstd
          mingw-w64-ucrt-x86_64-libidn2
          mingw-w64-ucrt-x86_64-libpsl
          mingw-w64-ucrt-x86_64-libssh2
          mingw-w64-ucrt-x86_64-nghttp2
          mingw-w64-ucrt-x86_64-libunistring
          mingw-w64-ucrt-x86_64-libiconv
          mingw-w64-ucrt-x86_64-curl

    # ── MSYS2 setup (dynamic: Qt6 packages + NSIS)
    - uses: msys2/setup-msys2@v2
      if: inputs.variant == 'dynamic'
      with:
        msystem: ucrt64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-curl
          mingw-w64-ucrt-x86_64-qt6-base
          mingw-w64-ucrt-x86_64-qt6-declarative
          mingw-w64-ucrt-x86_64-qt6-tools
          mingw-w64-ucrt-x86_64-qt6-translations
          mingw-w64-ucrt-x86_64-qt6-svg
          mingw-w64-ucrt-x86_64-nsis

    # ════════════════════════════════════════════════════════════════
    # STATIC variant — zero-DLL Qt 6.11.1 source build
    # ════════════════════════════════════════════════════════════════
    - name: Verify true-static GCC runtime
      if: inputs.variant == 'static'
      shell: msys2 {0}
      run: |
        set -euxo pipefail
        cat > /tmp/netdiag-static-runtime.cpp <<'CPP'
        #include <thread>

        int main()
        {
            std::thread worker([] {});
            worker.join();
            return 0;
        }
        CPP
        g++ -std=c++17 -O2 -static -static-libgcc -static-libstdc++ -pthread \
          /tmp/netdiag-static-runtime.cpp -o /tmp/netdiag-static-runtime.exe

        SYSTEM_DLLS="KERNEL32|KERNELBASE|USER32|GDI32|ADVAPI32|SHELL32|ole32|OLEAUT32|WS2_32|IPHLPAPI|DNSAPI|WINHTTP|WLANAPI|SETUPAPI|SHCORE|VERSION|IMM32|CRYPT32|CRYPTUI|RPCRT4|USP10|WLDAP32|NTDLL|bcrypt|ncrypt|NETAPI32|AUTHZ|UxTheme|comdlg32|comctl32|dwmapi|SHLWAPI|Secur32|USERENV|WINMM|WSOCK32|MPR|POWRPROF|PROPSYS|OLEACC|D3D9|D3D11|D3D12|DXGI|DWRITE|D2D1|OPENGL32|GLU32|WTSAPI32|RUNTIMEOBJECT|MSCMS|UUID|WINSPool|msvcrt|ucrtbase"
        mapfile -t DEPS < <(objdump -p /tmp/netdiag-static-runtime.exe | awk '/DLL Name/ {print $3}' | tr -d '\r' | sort -fu)
        for dll in "${DEPS[@]}"; do
          case "${dll,,}" in
            api-ms-win-*.dll|ext-ms-win-*.dll) continue ;;
          esac
          if ! echo "$dll" | grep -qiE "^(${SYSTEM_DLLS})\.dll$"; then
            echo "ERROR: GCC static-runtime probe imports a non-Windows DLL: $dll"
            exit 1
          fi
        done
        printf 'Verified GCC runtime imports:\n%s\n' "${DEPS[@]}"

    # - Cache C: curl true-static build (libcurl.a without DLL dependency) -
    # 5WHY: MSYS2's mingw-w64-ucrt-x86_64-curl package ships libcurl.a as
    # a DLL import library (equivalent to libcurl.dll.a).  Even with
    # -Wl,-Bstatic active, the linker uses the import lib which still
    # references libcurl-4.dll at runtime.  Building curl from source with
    # --disable-shared produces a true static libcurl.a that can be fully
    # absorbed into the exe, same pattern as the Qt source build below.
    - name: Cache curl static build
      id: cache-curl-static
      if: inputs.variant == 'static'
      uses: actions/cache@v4
      with:
        path: C:\opt\curl-static
        key: curl-static-ucrt-8.9.1-v3

    - name: Build curl from source (true static)
      if: inputs.variant == 'static' && steps.cache-curl-static.outputs.cache-hit != 'true'
      shell: msys2 {0}
      run: |
        set -euxo pipefail
        CURL_VER="8.9.1"
        echo ">>> Downloading curl ${CURL_VER} source..."
        curl -fsSL "https://curl.se/download/curl-${CURL_VER}.tar.xz" -o /tmp/curl-src.tar.xz
        echo ">>> Extracting..."
        mkdir -p /tmp/curl-build
        tar -xJf /tmp/curl-src.tar.xz -C /tmp/curl-build --strip-components=1
        rm /tmp/curl-src.tar.xz
        cd /tmp/curl-build
        echo ">>> Configuring curl with CMake (static only, no shared)..."
        # 5WHY: autotools configure+make failed with exit 127 in MSYS2
        # (make/nproc unavailable).  CMake is already installed for Qt
        # and has reliable cross-compilation support.  CMake curl build
        # produces a true static libcurl.a without DLL dependency.
        cmake -B build -S . -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF \
          -DCURL_USE_OPENSSL=ON \
          -DCURL_DISABLE_LDAP=ON \
          -DCURL_DISABLE_LDAPS=ON \
          -DCMAKE_INSTALL_PREFIX=/c/opt/curl-static \
          -DBUILD_CURL_EXE=OFF \
          -DBUILD_TESTING=OFF \
          -DCMAKE_C_FLAGS="-static -static-libgcc -pthread -O2" \
          -DCMAKE_FIND_LIBRARY_SUFFIXES=.a \
          -DCMAKE_PREFIX_PATH=/ucrt64
        echo ">>> Building curl..."
        cmake --build build --parallel 4
        echo ">>> Installing curl to /c/opt/curl-static..."
        cmake --install build
        echo ">>> Verifying static libcurl.a..."
        ls -lh /c/opt/curl-static/lib/libcurl.a
        file /c/opt/curl-static/lib/libcurl.a || true
        echo ">>> curl static build complete."

    # - Cache A: Qt source code (extracted tarball) -
    - name: Cache Qt source tarball
      id: cache-qt-src
      if: inputs.variant == 'static'
      uses: actions/cache@v4
      with:
        path: C:\opt\qt6-src
        key: qt6-src-6.11.1-v1

    - name: Download Qt source
      if: inputs.variant == 'static' && steps.cache-qt-src.outputs.cache-hit != 'true'
      shell: msys2 {0}
      run: |
        set -euxo pipefail
        QT_VER="6.11.1"
        QT_MAJMIN="${QT_VER%.*}"
        echo ">>> Downloading Qt ${QT_VER} source..."
        curl -fsSL "https://download.qt.io/official_releases/qt/${QT_MAJMIN}/${QT_VER}/single/qt-everywhere-src-${QT_VER}.tar.xz" -o /tmp/qt-src.tar.xz
        echo ">>> Extracting..."
        mkdir -p /c/opt/qt6-src
        tar -xJf /tmp/qt-src.tar.xz -C /c/opt/qt6-src --strip-components=1
        rm /tmp/qt-src.tar.xz

    # - Cache B: Qt build artifacts (install prefix) -
    - name: Cache Qt build artifacts
      id: cache-qt-build
      if: inputs.variant == 'static'
      uses: actions/cache@v4
      with:
        path: C:\opt\qt6-install
        key: qt6-build-ucrt-6.11.1-v3

    - name: Build Qt from source
      if: inputs.variant == 'static' && steps.cache-qt-build.outputs.cache-hit != 'true'
      shell: msys2 {0}
      run: |
        set -euxo pipefail
        cd /c/opt/qt6-src
        echo ">>> Configuring Qt (qtbase + qtshadertools + qtdeclarative + qttools only)..."
        cmake -G Ninja -B build -S . \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/c/opt/qt6-install \
          -DCMAKE_CXX_FLAGS="-static -static-libgcc -static-libstdc++ -pthread -O2" \
          -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++ -pthread" \
          -DCMAKE_C_FLAGS="-static -static-libgcc -pthread -O2" \
          -DCMAKE_FIND_LIBRARY_SUFFIXES=.a \
          -DFEATURE_static=ON -DFEATURE_shared=OFF \
          -DBUILD_SHARED_LIBS=OFF \
          -DFEATURE_pch=OFF -DFEATURE_icu=OFF -DFEATURE_dbus=OFF \
          -DFEATURE_system_zlib=OFF \
          -DFEATURE_system_brotli=OFF \
          -DFEATURE_system_pcre2=OFF \
          -DFEATURE_system_libb2=OFF \
          -DFEATURE_zstd=OFF \
          -DFEATURE_brotli=OFF \
          -DQT_BUILD_SUBMODULES="qtbase;qtshadertools;qtdeclarative;qttools" \
          -DQT_BUILD_EXAMPLES=OFF -DQT_BUILD_TESTS=OFF
        echo ">>> Building (4 submodules only)..."
        cmake --build build --parallel
        echo ">>> Installing..."
        cmake --install build
        echo ">>> Qt static build complete."

    # - Build Production -
    - name: Build Production (static)
      if: inputs.variant == 'static'
      shell: msys2 {0}
      run: |
        set -euxo pipefail
        mkdir -p dist
        # -static plus strict CMake archive selection ensures that Qt, curl,
        # GCC, Winpthreads, and curl's transitive dependencies are linked
        # from .a archives. Windows API DLLs remain the only PE imports.

        CMAKE_COMMON=(
          -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DPROJECT_VERSION="${{ inputs.pkg_version }}"
          "-DND_BUILD_NUMBER=${{ inputs.build_number }}"
          "-DND_GIT_HASH=${{ inputs.git_hash }}"
          -DAPP_EDITION=static
          -DND_STATIC_QT=ON
          -DND_STRICT_STATIC_WINDOWS=ON
          -DCMAKE_CXX_FLAGS="-static -static-libgcc -static-libstdc++ -pthread -O2"
          -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++ -pthread -Wl,--gc-sections"
          -DCMAKE_FIND_LIBRARY_SUFFIXES=.a
          -DCMAKE_PREFIX_PATH=/c/opt/qt6-install
          -DBUILD_TESTS=OFF
          -DCURL_STATICLIB=ON
          -DCURL_LIBRARY=/c/opt/curl-static/lib/libcurl.a
          -DCURL_INCLUDE_DIR=/c/opt/curl-static/include
        )

        cmake "${CMAKE_COMMON[@]}" -B build -S .
        ninja -C build net_diagnostics
        strip build/net_diagnostics.exe
        cp build/net_diagnostics.exe dist/NetDiagnostics-Windows-x86_64-Static.exe

    # - Reject every non-Windows PE import -
    - name: Verify zero non-Windows DLL imports
      if: inputs.variant == 'static'
      shell: msys2 {0}
      run: |
        set -euo pipefail
        EXE=dist/NetDiagnostics-Windows-x86_64-Static.exe
        # The whitelist is intentionally restricted to Windows OS APIs and
        # API-set forwarders. GCC, Qt, curl, and all other third-party DLLs
        # must never appear in a strict static artifact.
        SYSTEM_DLLS="KERNEL32|KERNELBASE|USER32|GDI32|ADVAPI32|SHELL32|ole32|OLEAUT32|WS2_32|IPHLPAPI|DNSAPI|WINHTTP|WLANAPI|SETUPAPI|SHCORE|VERSION|IMM32|CRYPT32|CRYPTUI|RPCRT4|USP10|WLDAP32|NTDLL|bcrypt|ncrypt|NETAPI32|AUTHZ|UxTheme|comdlg32|comctl32|dwmapi|shlwapi|secur32|userenv|winmm|wsock32|mpr|powrprof|propsys|oleacc|d3d9|d3d11|d3d12|dxgi|dwrite|d2d1|opengl32|glu32|wtsapi32|runtimeobject|mscms|uuid|winspool|msvcrt|ucrtbase"
        mapfile -t DEPS < <(objdump -p "$EXE" | awk '/DLL Name/ {print $3}' | tr -d '\r' | sort -fu)
        for dll in "${DEPS[@]}"; do
          case "${dll,,}" in
            api-ms-win-*.dll|ext-ms-win-*.dll) continue ;;
          esac
          if ! echo "$dll" | grep -qiE "^($SYSTEM_DLLS)\.(dll|drv)$"; then
            echo "ERROR: strict static executable imports a non-Windows DLL: $dll"
            exit 1
          fi
        done
        printf 'Verified static executable imports:\n%s\n' "${DEPS[@]}"

    # - Runtime smoke test with MSYS2 removed from PATH -
    - name: Smoke test standalone static executable
      if: inputs.variant == 'static'
      shell: powershell
      run: |
        $outputDirectory = (Resolve-Path "dist").Path
        $exe = Join-Path $outputDirectory "NetDiagnostics-Windows-x86_64-Static.exe"
        $originalPath = $env:PATH
        try {
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $proc = Start-Process -FilePath $exe -WorkingDirectory $outputDirectory -PassThru -WindowStyle Minimized
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            throw "Static executable exited early (exit code $($proc.ExitCode)); inspect loader or startup diagnostics."
          }
        }
        finally {
          if ($null -ne $proc -and -not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force
          }
          $env:PATH = $originalPath
        }

    - name: Upload artifacts (static)
      if: inputs.variant == 'static'
      uses: actions/upload-artifact@v4
      with:
        name: NetDiagnostics-Windows-x86_64-Static
        path: |
          dist/NetDiagnostics-Windows-x86_64-Static.exe
        if-no-files-found: error

    # ════════════════════════════════════════════════════════════════
    # DYNAMIC variant — MSYS2 Qt6 + NSIS installer
    # ════════════════════════════════════════════════════════════════
    - name: Build (dynamic)
      if: inputs.variant == 'dynamic'
      shell: msys2 {0}
      run: |
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DPROJECT_VERSION="${{ inputs.pkg_version }}" \
          -DND_BUILD_NUMBER=${{ inputs.build_number }} \
          -DND_GIT_HASH=${{ inputs.git_hash }} \
          -DAPP_EDITION=dynamic \
          -B build -S .
        ninja -C build net_diagnostics

    - name: Deploy Qt DLLs (windeployqt)
      if: inputs.variant == 'dynamic'
      shell: msys2 {0}
      run: |
        cd "$GITHUB_WORKSPACE"
        QT_BIN=/ucrt64/bin
        export PATH="$QT_BIN:$PATH"
        mkdir -p dist/installer
        cp build/net_diagnostics.exe dist/installer/
        # Copy third-party runtime DLLs that windeployqt doesn't handle
        for dll in libcurl-4 libssl-3-x64 libcrypto-3-x64 \
                   libgcc_s_seh-1 libstdc++-6 libwinpthread-1; do
          cp "$QT_BIN/${dll}.dll" dist/installer/ 2>/dev/null || true
        done
        echo "=== Deployed files ==="
        ls -R dist/installer/

    - name: Build NSIS installer
      if: inputs.variant == 'dynamic'
      shell: msys2 {0}
      run: |
        cd "$GITHUB_WORKSPACE"
        makensis -DSOURCE_DIR_WIN="$(cygpath -w "$PWD/dist/installer")" \
                 -DICON_WIN="$(cygpath -w "$PWD/resources/icons/netanalysis.ico")" \
                 -DOUTDIR_WIN="$(cygpath -w "$PWD/dist")" \
                 -DPRODUCT_VERSION="${{ inputs.pkg_version }}" \
                 scripts/installer/NetDiagnostic.nsi
        ls -lh dist/NetDiagnostics-Windows-x86_64.exe

    - name: Upload artifacts (dynamic)
      if: inputs.variant == 'dynamic'
      uses: actions/upload-artifact@v4
      with:
        name: NetDiagnostics-Windows-x86_64-Dynamic
        path: |
          dist/NetDiagnostics-Windows-x86_64.exe
        if-no-files-found: error
