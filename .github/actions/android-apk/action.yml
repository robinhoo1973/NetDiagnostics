# ═══════════════════════════════════════════════════════════════════════════
# Android APK Builder (androiddeployqt + Gradle)
# ═══════════════════════════════════════════════════════════════════════════
# 5WHY: The 60-line APK build script (sdkmanager + platform removal +
# cmake --build apk + APK discovery) was copy-pasted identically in both
# android-x86_64 and android-arm64 jobs.  Extracted here so APK packaging
# fixes propagate to all Android targets.
#
# Also works around a known Qt 6.5.3 limitation: the bundled Android Gradle
# Plugin 7.4.1 only supports compileSdk ≤ 33.  We install android-33 as the
# sole platform so androiddeployqt cannot pick a newer incompatible one.
#
# 5WHY (Android launch crash — missing androidx FileProvider): AndroidManifest
# declares androidx.core.content.FileProvider (for report sharing via
# ACTION_SEND), but Qt 6.5.3's gradle template only bundles local libs
# (implementation fileTree(dir:'libs')) and does NOT pull androidx from
# maven.  The packaged APK therefore had NO FileProvider class — Android
# fails to resolve the <provider> while parsing the manifest at launch,
# killing the process BEFORE Application.onCreate runs (zero startup log).
# Fix: ship androidx.core's classes.jar in the repo (resources/android/libs/
# androidx-core.jar), which CMake copies into the package source dir, and
# explicitly copy it into the androiddeployqt gradle project's libs/ so the
# fileTree dependency picks it up.
# ═══════════════════════════════════════════════════════════════════════════
name: Build Android APK
description: Builds an installable APK via androiddeployqt, zipalign, and apksigner (persistent release key when ND_KEYSTORE_* env is set, else debug key)
inputs:
  qt_version:
    description: Qt version used (e.g. 6.5.3)
    required: true
  output_name:
    description: Final APK filename (e.g. NetDiagnostics-Android-x86_64.apk)
    required: true
  icon_source:
    description: PNG to use as ic_launcher drawable
    required: false
    default: resources/icons/netanalysis.png
  build_dir:
    description: CMake build directory (defaults to build)
    required: false
    default: build
runs:
  using: composite
  steps:
    - name: Build APK
      shell: bash
      run: |
        set -euxo pipefail

        BUILD_DIR="${{ inputs.build_dir }}"
        # The Android package source is regenerated into ${BUILD_DIR}/android by
        # CMake (see cmake/netdiag-target.cmake) so the manifest can carry the
        # real version.  androiddeployqt reads that directory, so the launcher
        # icon must land there, not in the source tree.
        PKG_DIR="${BUILD_DIR}/android"
        mkdir -p "$PKG_DIR/res/drawable"
        cp "${{ inputs.icon_source }}" "$PKG_DIR/res/drawable/ic_launcher.png"

        # GitHub runners ship preview/extension SDK platforms
        # (android-*-extNN) plus a stub android-37; aapt2/gradle cannot use
        # them.  androiddeployqt defaults to the highest installed platform,
        # so install a clean android-33 + matching build-tools and make it
        # the ONLY platform available.
        # Qt 6.5.3 ships AGP 7.4.1 whose bundled aapt2 only supports
        # compileSdk ≤ 33.
        SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")
        yes 2>/dev/null | "$SDKMANAGER" "platforms;android-33" "build-tools;33.0.2" >/dev/null || true
        test -d "$ANDROID_SDK_ROOT/platforms/android-33" || { echo "ERROR: android-33 platform not installed"; exit 1; }

        # 5WHY: The Android debug keystore was used to explicitly sign the CI
        # artifact after Gradle produces its unsigned release APK.  GitHub
        # runners are ephemeral, so every run generated a NEW random debug key
        # -> installing a newer APK over an older one failed with
        # "update package signature does not match installed app"
        # (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
        #
        # Fix: when release signing secrets are provided, decode the PERSISTENT
        # release keystore so every build shares one key and upgrades install
        # cleanly.  PR builds (no secrets on fork/PR events) fall back to the
        # debug keystore because they are validation artifacts, not installs.
        # 5WHY: signing secrets reach this composite action via the STEP ENV
        # (build.yml sets ND_KEYSTORE_* from repo secrets).  Secrets must not
        # be passed through `with:` inputs: GitHub reliably masks env values
        # derived from secrets, but composite `inputs` get inlined into the
        # script text where masking is not guaranteed.  env also tolerates
        # multi-line values (e.g. base64 with newlines).
        set +x
        ND_RELEASE_KS_B64="${ND_KEYSTORE_B64:-}"
        if [ -n "$ND_RELEASE_KS_B64" ]; then
          SIGN_KS_STOREPASS="${ND_KEYSTORE_PASS:-}"
          if [ -z "$SIGN_KS_STOREPASS" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASS secret is required when ANDROID_KEYSTORE_B64 is set"
            exit 1
          fi
          # alias/pass default to the setup script's conventions so partial
          # secret configuration still signs correctly.
          SIGN_KS_ALIAS="${ND_KEY_ALIAS:-netdiag}"
          SIGN_KEY_PASS="${ND_KEY_PASS:-$SIGN_KS_STOREPASS}"
          echo "Signing with persistent release keystore (alias: $SIGN_KS_ALIAS)"
          printf '%s' "$ND_RELEASE_KS_B64" | base64 -d > "$RUNNER_TEMP/netdiag-release.keystore"
          test -s "$RUNNER_TEMP/netdiag-release.keystore" || { echo "ERROR: keystore base64 decoded to an empty file"; exit 1; }
          SIGN_KS="$RUNNER_TEMP/netdiag-release.keystore"
        else
          # 5WHY (round 2): keytool -genkey fails with FileNotFoundException if
          # ~/.android/ does not exist — keytool does NOT auto-create parent
          # directories.  The error message was also misleading: the stderr
          # suppression (2>/dev/null) hid the real FileNotFoundException and
          # the else-branch printed "keytool not available" even though keytool
          # was present and running.  Fix: mkdir -p the directory first, and
          # capture stderr for accurate error reporting.
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "Generating Android debug keystore..."
            mkdir -p ~/.android
            if keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" 2>/tmp/keytool-err.log; then
              echo "Debug keystore created: $(ls -la ~/.android/debug.keystore)"
            else
              echo "ERROR: keytool failed (exit $?) — cannot generate debug keystore"
              echo "keytool stderr:"; cat /tmp/keytool-err.log
              echo "Install a JDK that provides keytool (e.g. temurin-17) before building."
              exit 1
            fi
          else
            echo "Debug keystore exists: $(ls -la ~/.android/debug.keystore)"
          fi
          SIGN_KS="$HOME/.android/debug.keystore"
          SIGN_KS_ALIAS=androiddebugkey
          SIGN_KS_STOREPASS=android
          SIGN_KEY_PASS=android
        fi
        set -x

        shopt -s nullglob
        for p in "$ANDROID_SDK_ROOT"/platforms/*; do
          [ "$(basename "$p")" = "android-33" ] && continue
          echo "Removing SDK platform: $(basename "$p")"
          rm -rf "$p"
        done
        echo "Remaining platforms:"; ls "$ANDROID_SDK_ROOT/platforms"

        # Qt auto-generates an 'apk' target that runs androiddeployqt with the
        # generated deployment JSON, copies the app .so into the package, and
        # produces a release APK through Gradle.
        # 5WHY (Android launch crash — missing androidx FileProvider): ensure
        # androidx.core classes.jar is staged into the PACKAGE SOURCE dir
        # (build/android/libs) BEFORE androiddeployqt runs, so the generated
        # gradle project (build/android-build) — whose template uses
        # `implementation fileTree(dir:'libs')` — packages it into the APK.
        # Without it, the manifest's androidx.core.content.FileProvider has no
        # class in the APK and Android kills the process while parsing the
        # manifest at launch (zero startup log, instant crash).
        ANDROIDX_SRC="${{ github.workspace }}/resources/android/libs/androidx-core.jar"
        PKG_LIBS="$BUILD_DIR/android/libs"
        if [ -f "$ANDROIDX_SRC" ]; then
          mkdir -p "$PKG_LIBS"
          cp -f "$ANDROIDX_SRC" "$PKG_LIBS/androidx-core.jar"
          echo "androidx-core.jar staged into package source $PKG_LIBS"
        else
          echo "ERROR: androidx-core.jar not found at $ANDROIDX_SRC"
          exit 1
        fi

        cmake --build "$BUILD_DIR" --target apk

        # 5WHY (androidx packaging safety net): androiddeployqt copies
        # QT_ANDROID_PACKAGE_SOURCE_DIR into build/android-build.  Depending
        # on the Qt version it may or may not carry the libs/ subdirectory
        # into the gradle project.  Verify the jar actually reached
        # android-build/libs (the dir the template's fileTree scans); if not,
        # stage it there and rebuild so the APK always contains FileProvider.
        GRADLE_LIBS="$BUILD_DIR/android-build/libs"
        if [ ! -f "$GRADLE_LIBS/androidx-core.jar" ]; then
          echo "androidx jar not in gradle libs — staging and rebuilding"
          mkdir -p "$GRADLE_LIBS"
          cp -f "$ANDROIDX_SRC" "$GRADLE_LIBS/androidx-core.jar"
          cmake --build "$BUILD_DIR" --target apk
        else
          echo "androidx-core.jar already present in gradle libs"
        fi

        # 5WHY:
        # 1. CI requires an installable APK.
        # 2. Qt 6.5.3's Gradle release task emits *-release-unsigned.apk.
        # 3. Creating a keystore alone does not configure a Gradle release
        #    signingConfig.
        # 4. The previous collector excluded unsigned files but never signed
        #    them, so it found zero candidates.
        # 5. Align the one generated unsigned APK, then explicitly sign and
        #    verify the publishable artifact with the selected keystore
        #    (persistent release key when secrets are configured, else debug).
        APKSIGNER="$ANDROID_SDK_ROOT/build-tools/33.0.2/apksigner"
        ZIPALIGN="$ANDROID_SDK_ROOT/build-tools/33.0.2/zipalign"
        test -x "$APKSIGNER" || { echo "ERROR: apksigner not found: $APKSIGNER"; exit 1; }
        test -x "$ZIPALIGN" || { echo "ERROR: zipalign not found: $ZIPALIGN"; exit 1; }
        mapfile -t UNSIGNED_APKS < <(find "$BUILD_DIR" -path '*outputs/apk/*' -name '*unsigned*.apk' | sort)
        if [ "${#UNSIGNED_APKS[@]}" -ne 1 ]; then
          echo "ERROR: expected exactly one unsigned release APK, found ${#UNSIGNED_APKS[@]}"
          echo "Unsigned APK candidates:"
          printf '  %s\n' "${UNSIGNED_APKS[@]:-<none>}"
          exit 1
        fi

        UNSIGNED_APK="${UNSIGNED_APKS[0]}"
        ALIGNED_APK="${UNSIGNED_APK%.apk}-aligned.apk"
        SIGNED_APK="${UNSIGNED_APK%.apk}-signed.apk"
        rm -f "$ALIGNED_APK" "$SIGNED_APK" "${{ inputs.output_name }}"
        # 5WHY (round 2): zipalign in build-tools 33.0.2 has no -P option
        # (16 KB page alignment arrived in build-tools 35).  Passing -P 16
        # made zipalign exit 2 before alignment even started.  minSdk 26
        # with AGP 7.4.1 only needs classic 4-byte alignment, so use the
        # supported flag set for this pinned build-tools version.
        "$ZIPALIGN" -f -v 4 "$UNSIGNED_APK" "$ALIGNED_APK"
        "$ZIPALIGN" -c -v 4 "$ALIGNED_APK"
        # set +x: hide the expanded keystore password from the trace log
        set +x
        "$APKSIGNER" sign \
          --ks "$SIGN_KS" \
          --ks-key-alias "$SIGN_KS_ALIAS" \
          --ks-pass "pass:$SIGN_KS_STOREPASS" \
          --key-pass "pass:$SIGN_KEY_PASS" \
          --min-sdk-version 26 \
          --out "$SIGNED_APK" \
          "$ALIGNED_APK"
        set -x
        "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 26 "$SIGNED_APK"

        # 5WHY (Android launch crash safety net, startup-crash review 2026):
        # all staging above is build-time bookkeeping — the only proof that
        # matters is the FINAL signed APK actually carrying the androidx
        # FileProvider class in its dex.  A missing ContentProvider kills the
        # process while parsing the manifest at launch, BEFORE Application.
        # onCreate (zero startup log).  Assert on the artifact so any
        # regression (jar deleted, fileTree not scanned, gradle template
        # change) fails CI instead of shipping a guaranteed launcher crash.
        if ! unzip -p "$SIGNED_APK" 'classes*.dex' | strings -a | grep -q 'Landroidx/core/content/FileProvider'; then
          echo "ERROR: androidx FileProvider class missing from $SIGNED_APK classes.dex"
          exit 1
        fi
        echo "OK: androidx FileProvider present in APK dex"

        cp "$SIGNED_APK" "${{ inputs.output_name }}"
        ls -lh "${{ inputs.output_name }}"
