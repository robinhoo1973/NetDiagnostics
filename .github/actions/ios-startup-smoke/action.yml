# ═══════════════════════════════════════════════════════════════════════════
# iOS Startup Smoke Gate — TestFlight 上传前的启动闪退闸门 2 (composite action)
# ═══════════════════════════════════════════════════════════════════════════
# 5WHY (2026-09-04 iOS 启动闪退): ThemeEngine.qml 重复 Component.onCompleted
# 在 iOS 上触发通用崩溃链（engine.load 失败 → rootObjects 空 → exit(-1)），
# 29 项 pre-commit 检查全绿放行。双闸门设计：
#   闸门 1 — AOT 编译闸门（确定性）：scripts/qml-aot-gate.sh 全量 QML
#     qmlcachegen 编译。5WHY (simplify 2026-09-04): 已移入 build-ios
#     （与出货构建链同 kit 同版本，ios-upload 经 needs 天然被阻断）。
#   闸门 2 — 运行时启动烟测（本 action；iOS 二进制为 device-only 无法在
#     CI 运行，macOS 产物与 iOS 共享同一份 QML 层，2026-09-04 桌面同崩
#     已实证）：下载本流水线 macos-build 的 .app 产物，QT_QPA_PLATFORM=
#     offscreen 启动，轮询 12 秒——进程提前退出或日志出现 QML 加载失败
#     特征即 FAIL。
#   offscreen 插件由 build-macos（testflight 模式）在 macdeployqt 后
#     显式捆绑进 Contents/PlugIns/platforms（macdeployqt 默认只部署
#     cocoa）——2026-09-05 "Could not find the Qt platform plugin
#     offscreen" 的 5WHY 修复。
# 任一闸门 FAIL → 上传双双阻断（fail-closed：无启动证据不上传）。闸门 2
# 运行的就是 macOS 产物本身——烟测失败即 macOS 二进制启动即崩，macOS
# 上传同样没有意义。
# 调用方（apple.yml）负责 checkout 与 job 级配置。
# ═══════════════════════════════════════════════════════════════════════════
name: Startup Smoke Gate
description: Runtime startup smoke of the macOS artifact (shared QML layer) — gates both TestFlight uploads
runs:
  using: composite
  steps:
    - name: Download macOS artifact (shared QML layer)
      uses: actions/download-artifact@v4
      with:
        name: NetDiagnostics-macOS-app
        path: smoke-artifact

    - name: Runtime startup smoke (offscreen, 12s)
      shell: bash
      run: |
        set -euo pipefail
        tar -xzf smoke-artifact/NetDiagnostics-macOS.app.tar.gz
        BIN="net_diagnostics.app/Contents/MacOS/net_diagnostics"
        [ -f "$BIN" ] || { echo "[FAIL] macOS app binary not found"; exit 1; }
        # 5WHY: offscreen 平台规避无头会话差异；日志落文件供失败时全量输出。
        QT_QPA_PLATFORM=offscreen "$BIN" > smoke.log 2>&1 &
        PID=$!
        # 5WHY (simplify 2026-09-04): 三处重复 kill/wait 收敛为 EXIT trap——
        # 任一退出路径统一回收进程，失败分支只剩 cat + exit。
        trap 'kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true' EXIT
        EARLY=0
        for _ in {1..6}; do
          sleep 2
          if ! kill -0 "$PID" 2>/dev/null; then EARLY=1; break; fi
        done
        if [ "$EARLY" -eq 1 ]; then
          wait "$PID" || RC=$?
          echo "[FAIL] Gate 2: app exited during startup smoke (rc=${RC:-unknown})"
          cat smoke.log
          exit 1
        fi
        # 存活但日志出现加载失败特征同样拦截（引擎可能 print 后仍运行边缘态）
        if grep -qE 'QQmlApplicationEngine failed to load component|Type .* unavailable|Property value set multiple times|qFatal' smoke.log; then
          echo "[FAIL] Gate 2: startup error signature found in app log:"
          cat smoke.log
          exit 1
        fi
        echo "[PASS] Gate 2: app alive 12s with clean QML load — no startup crash"
