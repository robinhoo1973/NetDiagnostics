# ═══════════════════════════════════════════════════════════════════════════
# iOS Startup Smoke Gate — TestFlight 上传前的启动闪退双闸门 (composite action)
# ═══════════════════════════════════════════════════════════════════════════
# 5WHY (2026-09-04 iOS 启动闪退): ThemeEngine.qml 重复 Component.onCompleted
# 在 iOS 上触发通用崩溃链（engine.load 失败 → rootObjects 空 → exit(-1)），
# 29 项 pre-commit 检查全绿放行——qmllint 对此类错误零告警，历史检查从未
# 包含 AOT 编译与运行时验证。本 action 在 TestFlight 上传前执行两道闸门：
#
#   闸门 1 — AOT 编译闸门（确定性）:
#     用与 iOS 套件同版本的 Qt 6.8.3 qmlcachegen 全量编译全部 QML
#     （--bare -I src/Common/View，与 pre-commit check 21b 同标志集）。
#     qmlcachegen 是 iOS 静态构建实际使用的 AOT 编译器——加载期致命错误
#     （如 "Property value set multiple times"）在此被确定性拦截。
#
#   闸门 2 — 运行时启动烟测（iOS 二进制为 device-only 无法在 CI 运行，
#     macOS 产物与 iOS 共享同一份 QML 层，2026-09-04 桌面同崩已实证）:
#     下载本流水线 macos-build 的 .app 产物，QT_QPA_PLATFORM=offscreen
#     启动，轮询 12 秒——进程提前退出或日志出现 QML 加载失败特征即 FAIL。
#
# 任一闸门 FAIL → 本 job 失败 → ios-upload 与 macos-upload 双双被阻断
# （fail-closed：无启动证据不上传）。闸门 2 运行的就是 macOS 产物本身——
# 烟测失败即 macOS 二进制启动即崩，macOS 上传同样没有意义。
# 调用方（apple.yml）负责 checkout 与 job 级配置。
# ═══════════════════════════════════════════════════════════════════════════
name: Startup Smoke Gate
description: AOT-compile all QML (Qt 6.8.3 qmlcachegen) + runtime smoke of the macOS artifact — gates both TestFlight uploads
runs:
  using: composite
  steps:
    - uses: ./.github/actions/install-qt-aqt
      with:
        qt_version: "6.8.3"
        target: desktop
        arch: clang_64
        install_dir: /Users/runner/qt-desktop
        cache_key_prefix: qt6-ios-desktop

    # ── 闸门 1: AOT 编译（qmlcachegen 全量 QML）──────────────────────────
    - name: Gate 1 — AOT compile all QML (qmlcachegen)
      shell: bash
      run: |
        set -euo pipefail
        # 5WHY: 与 iOS 套件同版本（6.8.3）的 host qmlcachegen——AOT 编译
        # 的确定性闸门。find 定位路径（Qt 布局因版本/安装方式而异）。
        QMLCACHEGEN=$(find /Users/runner/qt-desktop/6.8.3 -type f -name qmlcachegen 2>/dev/null | head -1)
        [ -n "$QMLCACHEGEN" ] || { echo "[FAIL] qmlcachegen not found in qt-desktop kit"; exit 1; }
        echo "[OK] qmlcachegen: $QMLCACHEGEN"
        FAILED=0
        while IFS= read -r f; do
          if ! "$QMLCACHEGEN" --bare -I src/Common/View "$f" >/tmp/aot-err.log 2>&1; then
            echo "[FAIL] $f"
            cat /tmp/aot-err.log
            FAILED=1
          fi
        done < <(find src -name '*.qml' | sort)
        if [ "$FAILED" -ne 0 ]; then
          echo "[FAIL] Gate 1: qmlcachegen rejected QML — iOS startup crash class, TestFlight upload blocked"
          exit 1
        fi
        echo "[PASS] Gate 1: all QML AOT-compiles"

    # ── 闸门 2: macOS 产物运行时烟测（共享 QML 层）───────────────────────
    - name: Download macOS artifact (shared QML layer)
      uses: actions/download-artifact@v4
      with:
        name: NetDiagnostics-macOS-app
        path: smoke-artifact

    - name: Gate 2 — Runtime startup smoke (offscreen, 12s)
      shell: bash
      run: |
        set -euo pipefail
        tar -xzf smoke-artifact/NetDiagnostics-macOS.app.tar.gz
        BIN="net_diagnostics.app/Contents/MacOS/net_diagnostics"
        [ -f "$BIN" ] || { echo "[FAIL] macOS app binary not found"; exit 1; }
        # 5WHY: offscreen 平台规避无头会话差异；日志落文件供失败时全量输出。
        QT_QPA_PLATFORM=offscreen "$BIN" > smoke.log 2>&1 &
        PID=$!
        EARLY=0
        for _ in $(seq 1 6); do
          sleep 2
          if ! kill -0 "$PID" 2>/dev/null; then EARLY=1; break; fi
        done
        if [ "$EARLY" -eq 1 ]; then
          wait "$PID"; RC=$?
          echo "[FAIL] Gate 2: app exited during startup smoke (rc=$RC)"
          cat smoke.log
          exit 1
        fi
        # 存活但日志出现加载失败特征同样拦截（引擎可能 print 后仍运行边缘态）
        if grep -qE 'QQmlApplicationEngine failed to load component|Type .* unavailable|Property value set multiple times|qFatal' smoke.log; then
          echo "[FAIL] Gate 2: startup error signature found in app log:"
          cat smoke.log
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          exit 1
        fi
        kill "$PID" 2>/dev/null || true
        wait "$PID" 2>/dev/null || true
        echo "[PASS] Gate 2: app alive 12s with clean QML load — no startup crash"
