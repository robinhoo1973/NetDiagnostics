name: Setup macOS Keychain
description: Create a temporary keychain, import a certificate, and authorize tools
inputs:
  primary_cert_base64:
    description: Base64-encoded primary .p12 certificate (e.g. Mac Installer Distribution or iOS Distribution)
    required: true
  primary_cert_password:
    description: Password for the primary .p12 certificate
    required: true
  secondary_cert_base64:
    description: Optional secondary Base64-encoded .p12 certificate (e.g. Mac App Distribution cert for .app signing)
    required: false
    default: ""
  secondary_cert_password:
    description: Password for the optional secondary .p12 certificate
    required: false
    default: ""
  allowed_tools:
    description: Space-separated paths of tools allowed to access the key
    required: false
    default: "/usr/bin/codesign /usr/bin/pkgbuild /usr/bin/productbuild /usr/bin/xcodebuild"
outputs:
  keychain_path:
    description: Path to the created keychain
    value: ${{ steps.setup.outputs.keychain_path }}
  code_identity:
    description: Signing identity for codesign (Application cert)
    value: ${{ steps.setup.outputs.code_identity }}
  installer_identity:
    description: Signing identity for pkgbuild/productbuild (Installer cert)
    value: ${{ steps.setup.outputs.installer_identity }}

runs:
  using: composite
  steps:
    - id: setup
      shell: bash
      env:
        PRIMARY_CERT_BASE64: ${{ inputs.primary_cert_base64 }}
        PRIMARY_CERT_PASSWORD: ${{ inputs.primary_cert_password }}
        SECONDARY_CERT_BASE64: ${{ inputs.secondary_cert_base64 }}
        SECONDARY_CERT_PASSWORD: ${{ inputs.secondary_cert_password }}
        ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
      run: |
        set -euo pipefail
        KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
        KEYCHAIN_PATH="$RUNNER_TEMP/signing-${RANDOM}.keychain-db"

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security default-keychain -s "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security list-keychain -d user -s "$KEYCHAIN_PATH"

        TOOL_ARGS=""
        for tool in $ALLOWED_TOOLS; do
          TOOL_ARGS="$TOOL_ARGS -T $tool"
        done

        # ── 5WHY (2026-09-26 证书临期盲区): 管线仅在手动触发/打 tag 时运行
        # （实测间隔可长达数周）——证书/Profile 过期要到发布时刻才暴露，成为
        # 发布阻塞。临期硬门：p12 导入前先解出证书到期日，< 30 天即 FAIL——
        # 把"发布时阻塞"转化为"构建期硬信号"，留足换证窗口（业界最佳实践）。
        cert_expiry_check() {
          local p12_file="$1" p12_pass="$2" label="$3"
          local enddate
          enddate=$(openssl pkcs12 -in "$p12_file" -passin "pass:${p12_pass}" -clcerts -nokeys 2>/dev/null \
            | openssl x509 -noout -enddate 2>/dev/null | sed 's/notAfter=//')
          [ -z "$enddate" ] && { echo "::error::$label: cannot parse certificate expiry from p12"; exit 1; }
          local epoch end_epoch days_left
          end_epoch=$(date -j -f "%b %e %T %Y %Z" "$enddate" +%s 2>/dev/null \
            || date -d "$enddate" +%s 2>/dev/null || { echo "::error::$label: cannot parse date '$enddate'"; exit 1; })
          epoch=$(date +%s)
          days_left=$(( (end_epoch - epoch) / 86400 ))
          if [ "$days_left" -lt 30 ]; then
            echo "::error::$label certificate expires in $days_left days ($enddate) — rotate now, releases will be blocked"
            exit 1
          fi
          echo "::notice::$label certificate valid until $enddate ($days_left days left)"
        }

        # ── Import primary cert ──
        printf '%s' "$PRIMARY_CERT_BASE64" | base64 -d > "$RUNNER_TEMP/signing-cert.p12"
        cert_expiry_check "$RUNNER_TEMP/signing-cert.p12" "$PRIMARY_CERT_PASSWORD" "Primary signing certificate"
        security import "$RUNNER_TEMP/signing-cert.p12" \
          -k "$KEYCHAIN_PATH" \
          -P "$PRIMARY_CERT_PASSWORD" \
          -t cert -f pkcs12 \
          -A $TOOL_ARGS
        rm -f "$RUNNER_TEMP/signing-cert.p12"

        # ── Import secondary cert (optional) ──
        if [ -n "${SECONDARY_CERT_BASE64:-}" ]; then
          printf '%s' "$SECONDARY_CERT_BASE64" | base64 -d > "$RUNNER_TEMP/signing-cert-secondary.p12"
          cert_expiry_check "$RUNNER_TEMP/signing-cert-secondary.p12" "${SECONDARY_CERT_PASSWORD:-}" "Secondary signing certificate"
          security import "$RUNNER_TEMP/signing-cert-secondary.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "${SECONDARY_CERT_PASSWORD:-}" \
            -t cert -f pkcs12 \
            -A $TOOL_ARGS
          rm -f "$RUNNER_TEMP/signing-cert-secondary.p12"
        fi

        # Allow codesign/xcodebuild to access the key without prompting
        security set-key-partition-list -S apple-tool:,apple: \
          -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null 2>&1 || true

        # Find signing identities.  "Installer" certs can only sign .pkg,
        # "Application" certs can sign code.  Output both separately.
        # Use { } || true because set -o pipefail would kill the script when
        # grep finds no match, before the fallback below can run.
        CODE_IDENTITY=""
        { CODE_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" \
          | grep -iE "Apple (Development|Distribution)|Developer ID|Mac Developer|iPhone (Developer|Distribution)" \
          | grep -vi "Installer" | head -1 | sed 's/.*"\(.*\)".*/\1/'); } || true
        INSTALLER_IDENTITY=""
        { INSTALLER_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" \
          | grep -iE "Developer ID Installer|Mac Installer Distribution|Mac Developer Installer" | head -1 | sed 's/.*"\(.*\)".*/\1/'); } || true
        # Fallback: pick any valid non-revoked non-expired non-Installer identity
        if [ -z "$CODE_IDENTITY" ] || [ "$CODE_IDENTITY" = "null" ]; then
          { CODE_IDENTITY=$(security find-identity -v "$KEYCHAIN_PATH" \
            | grep -vi "REVOKED\|expired\|Installer" | grep '"' | head -1 | sed 's/.*"\(.*\)".*/\1/'); } || true
        fi
        if [ -z "$INSTALLER_IDENTITY" ]; then
          INSTALLER_IDENTITY="$CODE_IDENTITY"
        fi

        echo "keychain_path=${KEYCHAIN_PATH}" >> "$GITHUB_OUTPUT"
        echo "code_identity=${CODE_IDENTITY}" >> "$GITHUB_OUTPUT"
        echo "installer_identity=${INSTALLER_IDENTITY}" >> "$GITHUB_OUTPUT"
        echo "Keychain: $KEYCHAIN_PATH"
        echo "Code identity: $CODE_IDENTITY"
        echo "Installer identity: $INSTALLER_IDENTITY"