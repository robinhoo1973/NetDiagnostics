# ═══════════════════════════════════════════════════════════════════════════
# Build & Release — MASTER CALLER (Release-download artifacts only)
# ═══════════════════════════════════════════════════════════════════════════
# This workflow builds ONLY the install files / executables that users
# download from the GitHub Release page.  Every platform build is delegated
# to a step-level composite action under .github/actions/:
#
#   · build-linux     (matrix: x86_64, arm64)   → AppImage / deb / rpm
#   · build-windows   (static + dynamic jobs)   → standalone exe / NSIS installer
#   · build-android   (matrix: arm64+x86_64 × apk+aab) → installable APK / Play AAB
#   · build-macos     (release packaging only)  → DMG / tar.gz download format
#
# Only THREE standalone workflows exist (build.yml, apple.yml,
# cleanup-runs.yml); everything else lives in .github/actions/ as composite
# actions.  Version is detected once in the version job via the
# detect-version action and passed to every build job.
#
# Google Play upload (optional): workflow_dispatch input deploy=google-play
# restricts the Android matrix to the arm64 AAB cell and runs the
# deploy-google-play job (environment: GooglePlay).  Default deploy=none keeps
# this workflow Release-downloads-only.
#
# Triggers: workflow_dispatch (manual), pull_request (validation), tag push
# (release).  The release job collects every artifact into a GitHub Release.
# ═══════════════════════════════════════════════════════════════════════════
name: Build & Release

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Upload target for this run (none | google-play)
        type: choice
        options:
          - none
          - google-play
        default: none
  pull_request:
    branches: [master]
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Version — detected once, shared by every build job ──────────────
  version:
    name: Detect Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pkg_version: ${{ steps.v.outputs.pkg_version }}
      pkg_prerelease: ${{ steps.v.outputs.pkg_prerelease }}
      build_number: ${{ steps.v.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: v
        uses: ./.github/actions/detect-version

  # ═══ Linux — build-linux action (arch matrix) ═══
  linux:
    name: Linux ${{ matrix.arch }}
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    runs-on: ${{ matrix.arch == 'x86_64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-linux
        with:
          arch: ${{ matrix.arch }}
          pkg_version: ${{ needs.version.outputs.pkg_version }}
          build_number: ${{ needs.version.outputs.build_number }}
          git_hash: ${{ github.sha }}

  # ═══ Windows — build-windows action (two jobs: static / dynamic) ═══
  # 5WHY: static (150 min Qt source build) and dynamic (30 min NSIS) need
  # different timeouts, so they are separate jobs instead of a matrix cell.
  windows-static:
    name: Windows x86_64 Static
    needs: [version]
    runs-on: windows-2022
    # 5WHY: 90 min was insufficient — Qt 6.11.1 source build on a 2-core
    # GitHub runner takes ~105 min for 7400 translation units.  150 min
    # provides safe headroom for the full pipeline (curl → Qt → app).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-windows
        with:
          variant: static
          pkg_version: ${{ needs.version.outputs.pkg_version }}
          build_number: ${{ needs.version.outputs.build_number }}
          git_hash: ${{ github.sha }}

  windows-dynamic:
    name: Windows x86_64 Dynamic
    needs: [version]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-windows
        with:
          variant: dynamic
          pkg_version: ${{ needs.version.outputs.pkg_version }}
          build_number: ${{ needs.version.outputs.build_number }}
          git_hash: ${{ github.sha }}

  # ═══ macOS — build-macos action, release download format (DMG / tar.gz) ═══
  # 5WHY: build.yml only produces Release-download files.  TestFlight uploads
  # (iOS + macOS) run in apple.yml as two parallel standalone tasks.
  macos:
    name: macOS (release download)
    needs: [version]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-macos
        with:
          mode: release
          pkg_version: ${{ needs.version.outputs.pkg_version }}
          build_number: ${{ needs.version.outputs.build_number }}
          git_hash: ${{ github.sha }}

  # ═══ Android — build-android action (arch × format matrix) ═══
  # 5WHY: build.yml only produces Release-download files (APK/AAB) by default.
  # deploy=google-play (workflow_dispatch) restricts the matrix to the arm64
  # AAB cell and enables the deploy-google-play job below.
  #
  # 5WHY (matrix in job if): the `matrix` context is NOT available in a
  # job-level `if` (matrix expands after if is evaluated).  The cell filter
  # therefore lives in a step-level `if`; skipped cells are cheap no-ops.
  android:
    name: Android ${{ matrix.arch }} (${{ matrix.format }})
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, format: apk }
          - { arch: arm64, format: aab }
          - { arch: x86_64, format: apk }
          - { arch: x86_64, format: aab }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Skip non-Play cell
        if: ${{ inputs.deploy == 'google-play' && !(matrix.arch == 'arm64' && matrix.format == 'aab') }}
        run: echo "deploy=google-play — skipping non-arm64/aab cell"
      - uses: ./.github/actions/build-android
        if: ${{ inputs.deploy != 'google-play' || (matrix.arch == 'arm64' && matrix.format == 'aab') }}
        with:
          arch: ${{ matrix.arch }}
          format: ${{ matrix.format }}
          pkg_version: ${{ needs.version.outputs.pkg_version }}
          pkg_prerelease: ${{ needs.version.outputs.pkg_prerelease }}
          build_number: ${{ needs.version.outputs.build_number }}
          git_hash: ${{ github.sha }}
        env:
          # 5WHY: the `secrets` context is unavailable inside composite
          # actions — the caller MUST pass secrets via step env.  Every
          # release build shares ONE signing key so upgrades install
          # cleanly; empty on PR/fork → debug-keystore fallback.
          ND_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ND_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ND_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ND_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}

  # ═══ Google Play deploy — optional, deploy=google-play only ═══
  # 5WHY: mirror the TestFlight environment pattern — environment-scoped
  # secrets keep the Play service account out of the default repo secret
  # namespace and give the deploy a visible approval gate if the user adds
  # one to the "GooglePlay" environment.
  deploy-google-play:
    name: Deploy Android to Google Play
    needs: [version, android]
    if: inputs.deploy == 'google-play'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: GooglePlay
    steps:
      - uses: ./.github/actions/deploy-google-play
        with:
          track: internal
          release_status: completed
          pkg_version: ${{ needs.version.outputs.pkg_version }}
          pkg_prerelease: ${{ needs.version.outputs.pkg_prerelease }}
        env:
          # 5WHY: the `secrets` context is unavailable inside composite
          # actions — the caller must pass the Play service account via step
          # env.  The job's `environment: GooglePlay` provides this secret.
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

  # ═══ Release — collect all artifacts → GitHub Release ═══
  release:
    name: Create Release
    needs: [version, linux, windows-static, windows-dynamic, macos, android]
    # 5WHY: on pull_request the release job would create/overwrite real GitHub
    # Releases (e.g. v0.0.1 when no tags exist).  Gating on event_name ensures
    # releases only fire on manual workflow_dispatch / tag push, never on PR
    # validation.
    if: (!failure()) && (!cancelled()) && (github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute release tag
        id: version
        run: |
          TAG="v${{ needs.version.outputs.pkg_version }}"
          echo "next_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect individual assets
        run: |
          cd artifacts
          mkdir -p release-assets

          # Debug: show all downloaded artifact files
          echo "=== All downloaded files ==="
          find . -type f | sort
          echo "============================"

          # Copy assets with consistent naming: netdiagnostics-{os}-{arch}.{ext}
          for dir in */; do
            dir_lower=$(echo "$dir" | tr '[:upper:]' '[:lower:]')
            suffix=""
            case "$dir_lower" in
              *windows*static*)
                os="windows"; arch="x86_64"; suffix="-static" ;;
              *windows*dynamic*)
                os="windows"; arch="x86_64"; suffix="-dynamic" ;;
              *windows*)
                os="windows"; arch="x86_64" ;;
              *linux-x86_64*|*linux*86*)
                os="linux"; arch="x86_64" ;;
              *linux-arm64*|*linux*arm*)
                os="linux"; arch="arm64" ;;
              *android-x86_64*|*android*x86*)
                os="android"; arch="x86_64" ;;
              *android-arm64*|*android*arm*)
                os="android"; arch="arm64" ;;
              # macOS: only the release-packaging artifact is collected
              # (DMG/tar.gz); the internal .app tar is consumed by the
              # upload-testflight-macos action inside apple.yml.
              *macos-release*)
                os="macos"; arch="arm64" ;;
              *macos*|*ios*)
                echo "Skipping Apple internal artifact (handled inside apple.yml): $dir"; continue ;;
              *)
                echo "Skipping unknown: $dir"; continue ;;
            esac
            echo "Processing: $dir → $os/$arch"
            while IFS= read -r f; do
              base=$(basename "$f" | tr '[:upper:]' '[:lower:]')
              ext="${base##*.}"
              normalized_ext="$ext"
              [ "$normalized_ext" = "appimage" ] && normalized_ext="AppImage"
              case "$base" in
                *.appimage) name="netdiagnostics-${os}-${arch}.${normalized_ext}" ;;
                *.deb)      name="netdiagnostics-${os}-${arch}.deb" ;;
                *.rpm)      name="netdiagnostics-${os}-${arch}.rpm" ;;
                *.apk)      name="netdiagnostics-${os}-${arch}.apk" ;;
                *.aab)      name="netdiagnostics-${os}-${arch}.aab" ;;
                *.dmg)      name="netdiagnostics-${os}-${arch}.dmg" ;;
                *netdiagnostics-*.exe)
                  if [ "$suffix" = "-dynamic" ]; then
                    name="netdiagnostics-${os}-${arch}${suffix}-setup.exe"
                  else
                    name="netdiagnostics-${os}-${arch}${suffix}.exe"
                  fi ;;
                *.exe)
                  name="netdiagnostics-${os}-${arch}${suffix}.exe" ;;
                *)          name="$base" ;;
              esac
              cp "$f" "release-assets/$name"
              echo "  → $name"
            done < <(find "$dir" -type f ! -name "*.o" ! -name "*.obj")
          done

          echo ""
          echo "=== Release assets ==="
          ls -lh release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.next_tag }}
          files: |
            artifacts/release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
