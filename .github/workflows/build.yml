# ═══════════════════════════════════════════════════════════════════════════
# Build & Release — MASTER CALLER (Release-download artifacts only)
# ═══════════════════════════════════════════════════════════════════════════
# This workflow builds ONLY the install files / executables that users
# download from the GitHub Release page.  It delegates each platform to a
# parameterized reusable workflow:
#
#   · linux.yml     (matrix: x86_64, arm64)   → AppImage / deb / rpm
#   · windows.yml   (matrix: static, dynamic) → standalone exe / NSIS installer
#   · android.yml   (matrix: arm64+x86_64 × apk+aab) → installable APK / Play AAB
#   · macos.yml     (release packaging only)  → DMG / tar.gz download format
#
# Store uploads are deliberately OUT of this pipeline (each is a standalone,
# parameterized workflow):
#   · Google Play upload  → android.yml (deploy=google-play)
#   · iOS code compile    → ios.yml (standalone build + validation)
#   · iOS/macOS TestFlight upload → testflight.yml (platform: ios | macos | both)
#
# Triggers: workflow_dispatch (manual), pull_request (validation), tag push
# (release).  The release job collects every artifact into a GitHub Release.
# ═══════════════════════════════════════════════════════════════════════════
name: Build & Release

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Version — used by the release job only (children detect their own) ──
  version:
    name: Detect Version
    uses: ./.github/workflows/version.yml

  # ═══ Linux — linux.yml (arch matrix) ═══
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    uses: ./.github/workflows/linux.yml
    with:
      arch: ${{ matrix.arch }}

  # ═══ Windows — windows.yml (variant matrix) ═══
  windows:
    name: Windows ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        variant: [static, dynamic]
    uses: ./.github/workflows/windows.yml
    with:
      variant: ${{ matrix.variant }}

  # ═══ macOS — macos.yml, release download format (DMG / tar.gz) ═══
  # 5WHY: build.yml only produces Release-download files.  TestFlight uploads
  # (iOS + macOS) run in apple.yml as two parallel standalone tasks.
  macos:
    name: macOS (release download)
    uses: ./.github/workflows/macos.yml

  # ═══ Android — android.yml (arch × format matrix, release downloads) ═══
  # 5WHY: build.yml only produces Release-download files (APK/AAB).  Google
  # Play uploads run standalone via android.yml (deploy=google-play).
  android:
    name: Android ${{ matrix.arch }} (${{ matrix.format }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, format: apk }
          - { arch: arm64, format: aab }
          - { arch: x86_64, format: apk }
          - { arch: x86_64, format: aab }
    uses: ./.github/workflows/android.yml
    with:
      arch: ${{ matrix.arch }}
      format: ${{ matrix.format }}
      deploy: none
    secrets:
      # Signing secrets are always forwarded so every build shares ONE key
      # (upgrades install cleanly); the google-play deploy is a separate
      # standalone trigger.  Empty on PR/fork → debug-keystore fallback.
      ND_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ND_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      ND_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ND_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

  # ═══ Release — collect all artifacts → GitHub Release ═══
  release:
    name: Create Release
    needs: [version, linux, windows, macos, android]
    # 5WHY: on pull_request the release job would create/overwrite real GitHub
    # Releases (e.g. v0.0.1 when no tags exist).  Gating on event_name ensures
    # releases only fire on manual workflow_dispatch / tag push, never on PR
    # validation.
    if: (!failure()) && (!cancelled()) && (github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute release tag
        id: version
        run: |
          TAG="v${{ needs.version.outputs.pkg_version }}"
          echo "next_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect individual assets
        run: |
          cd artifacts
          mkdir -p release-assets

          # Debug: show all downloaded artifact files
          echo "=== All downloaded files ==="
          find . -type f | sort
          echo "============================"

          # Copy assets with consistent naming: netdiagnostics-{os}-{arch}.{ext}
          for dir in */; do
            dir_lower=$(echo "$dir" | tr '[:upper:]' '[:lower:]')
            suffix=""
            case "$dir_lower" in
              *windows*static*)
                os="windows"; arch="x86_64"; suffix="-static" ;;
              *windows*dynamic*)
                os="windows"; arch="x86_64"; suffix="-dynamic" ;;
              *windows*)
                os="windows"; arch="x86_64" ;;
              *linux-x86_64*|*linux*86*)
                os="linux"; arch="x86_64" ;;
              *linux-arm64*|*linux*arm*)
                os="linux"; arch="arm64" ;;
              *android-x86_64*|*android*x86*)
                os="android"; arch="x86_64" ;;
              *android-arm64*|*android*arm*)
                os="android"; arch="arm64" ;;
              # macOS: only the release-packaging artifact is collected
              # (DMG/tar.gz); the internal .app tar is consumed by the
              # package-release/testflight jobs inside macos.yml.
              *macos-release*)
                os="macos"; arch="arm64" ;;
              *macos*|*ios*)
                echo "Skipping Apple internal artifact (handled inside macos.yml): $dir"; continue ;;
              *)
                echo "Skipping unknown: $dir"; continue ;;
            esac
            echo "Processing: $dir → $os/$arch"
            while IFS= read -r f; do
              base=$(basename "$f" | tr '[:upper:]' '[:lower:]')
              ext="${base##*.}"
              normalized_ext="$ext"
              [ "$normalized_ext" = "appimage" ] && normalized_ext="AppImage"
              case "$base" in
                *.appimage) name="netdiagnostics-${os}-${arch}.${normalized_ext}" ;;
                *.deb)      name="netdiagnostics-${os}-${arch}.deb" ;;
                *.rpm)      name="netdiagnostics-${os}-${arch}.rpm" ;;
                *.apk)      name="netdiagnostics-${os}-${arch}.apk" ;;
                *.aab)      name="netdiagnostics-${os}-${arch}.aab" ;;
                *.dmg)      name="netdiagnostics-${os}-${arch}.dmg" ;;
                *netdiagnostics-*.exe)
                  if [ "$suffix" = "-dynamic" ]; then
                    name="netdiagnostics-${os}-${arch}${suffix}-setup.exe"
                  else
                    name="netdiagnostics-${os}-${arch}${suffix}.exe"
                  fi ;;
                *.exe)
                  name="netdiagnostics-${os}-${arch}${suffix}.exe" ;;
                *)          name="$base" ;;
              esac
              cp "$f" "release-assets/$name"
              echo "  → $name"
            done < <(find "$dir" -type f ! -name "*.o" ! -name "*.obj")
          done

          echo ""
          echo "=== Release assets ==="
          ls -lh release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.next_tag }}
          files: |
            artifacts/release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
