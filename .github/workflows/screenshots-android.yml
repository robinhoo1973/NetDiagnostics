name: Screenshots (Android Emulator)

# Phase 3 of the screenshot pipeline: builds an x86_64 APK (so it runs in
# the CI emulator), boots a phone + a tablet AVD, drives each like a user
# with `adb shell input` (tap/swipe/text), captures OS-level screenshots with
# `adb exec-out screencap`, and uploads them as artifacts.
#
# GitHub-hosted runners have NO KVM → the emulator runs in pure software
# emulation (-accel off): boot takes ~5-15 min, so this workflow is
# manual-trigger only and uses generous timeouts.
#
# Output (artifacts only — no auto-commit, avoid push races with the desktop
# workflow's nightly commit):
#   resources/doc/screenshot/android/phone/*.png
#   resources/doc/screenshot/android/tablet/*.png

on:
  workflow_dispatch:

concurrency:
  group: screenshots-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  QT_VERSION_ANDROID: 6.5.3
  ANDROID_API_LEVEL: "26"
  APK: NetDiagnostics-Android-x86_64.apk

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Build — x86_64 APK (mirrors build.yml android-x86_64)
  # ═══════════════════════════════════════════════════════════════════════
  build:
    name: Build APK (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build
          python3 -m venv /tmp/venv && source /tmp/venv/bin/activate && pip install aqtinstall
          echo "/tmp/venv/bin" >> "$GITHUB_PATH"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Qt6 desktop (host tools)
        id: cache-qt-desktop
        uses: actions/cache@v4
        with:
          path: /opt/qt-desktop
          key: qt6-android-desktop-${{ env.QT_VERSION_ANDROID }}-v1

      - name: Install Qt6 desktop via aqt
        if: steps.cache-qt-desktop.outputs.cache-hit != 'true'
        run: aqt install-qt linux desktop $QT_VERSION_ANDROID gcc_64 -O /opt/qt-desktop

      - name: Cache Qt6 Android x86_64
        id: cache-qt-android
        uses: actions/cache@v4
        with:
          path: /opt/qt-android-x86_64
          key: qt6-android-x86_64-${{ env.QT_VERSION_ANDROID }}-v1

      - name: Install Qt6 for Android via aqt
        if: steps.cache-qt-android.outputs.cache-hit != 'true'
        run: aqt install-qt linux android $QT_VERSION_ANDROID android_x86_64 -O /opt/qt-android-x86_64

      - name: Configure
        run: |
          set -euo pipefail
          cmake -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DPROJECT_VERSION=0.0.1 \
            -DND_BUILD_NUMBER=${{ github.run_number }} \
            -DND_GIT_HASH=${{ github.sha }} \
            -DAPP_EDITION=android-x86_64-screenshots \
            -DCMAKE_PREFIX_PATH="/opt/qt-android-x86_64/$QT_VERSION_ANDROID/android_x86_64" \
            -DQT_HOST_PATH="/opt/qt-desktop/$QT_VERSION_ANDROID/gcc_64" \
            -DCMAKE_FIND_ROOT_PATH="/opt/qt-android-x86_64/$QT_VERSION_ANDROID/android_x86_64" \
            -DANDROID_SDK_ROOT=$ANDROID_SDK_ROOT \
            -DANDROID_NDK_ROOT=$ANDROID_NDK_ROOT \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=x86_64 \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API_LEVEL }} \
            -B build -S .

      - name: Build
        run: ninja -C build net_diagnostics

      - uses: ./.github/actions/android-apk
        with:
          qt_version: ${{ env.QT_VERSION_ANDROID }}
          output_name: ${{ env.APK }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-x86_64
          path: ${{ env.APK }}
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════
  # Phone — reactivecircus default AVD (API 30, x86_64)
  # ═══════════════════════════════════════════════════════════════════════
  phone:
    name: Android Phone
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk-x86_64

      # The no-KVM emulator is inherently fragile — custom AVD recreation
      # inside the script block causes timeout/kill races.  Keep it simple:
      # boot the default AVD, install APK, drive, capture.
      - name: Boot emulator + capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          avd-name: phone
          force-avd-creation: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          boot-timeout: 900000
          script: |
            # reactivecircus runs this with /usr/bin/sh (dash) — no pipefail.
            set -eu
            adb install "${{ env.APK }}"
            adb shell input keyevent 82 || true
            bash scripts/screenshot/drive-android.sh resources/doc/screenshot/android/phone

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-android-phone
          path: resources/doc/screenshot/android/phone/*.png
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════
  # Commit — collect screenshots and push back to master
  # ═══════════════════════════════════════════════════════════════════════
  commit:
    name: Commit screenshots
    needs: [phone]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Copy screenshots to repo
        run: |
          set -euo pipefail
          COPIED=0
          while IFS= read -r png; do
            rel="${png#artifacts/}"
            case "$rel" in
              resources/*)   dest="$rel" ;;
              screenshots-*) dest="resources/doc/screenshot/${rel#screenshots-}" ;;
              *)             dest="resources/doc/screenshot/$rel" ;;
            esac
            mkdir -p "$(dirname "$dest")"
            cp -f "$png" "$dest"
            COPIED=$((COPIED + 1))
          done < <(find artifacts -name '*.png' -type f 2>/dev/null || true)
          echo "Copied $COPIED screenshot(s)"

      - name: Commit and push
        env:
          GIT_AUTHOR_NAME: robinhoo1973
          GIT_AUTHOR_EMAIL: robinhoo1973@users.noreply.github.com
          GIT_COMMITTER_NAME: robinhoo1973
          GIT_COMMITTER_EMAIL: robinhoo1973@users.noreply.github.com
        run: |
          set -euo pipefail
          git add resources/doc/screenshot README.md README_zh_CN.md README_zh_TW.md
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit"
            exit 0
          fi
          git commit -m "docs: refresh Android screenshots via screenshot CI"
          git pull --rebase origin master
          git push origin master
