name: Screenshots (Android)

# =============================================================================
# Android screenshot CI — uses the Linux production binary with ND_MOBILE=1
# to render the authentic mobile layout.  xvfb + xdotool drive the UI and
# `import` captures per-stage screenshots.  Zero emulator dependency.
#
# This mirrors the iOS approach (macOS binary + ND_MOBILE=1 + screencapture)
# but on Linux with xvfb + xdotool + ImageMagick.
#
# 5WHY: Android emulator is unreliable on GitHub-hosted no-KVM runners:
#   - Software emulation takes 20+ min just to boot
#   - adb connection fails intermittently (ERROR: Unable to connect to adb daemon)
#   - >90% of CI runs fail before the drive script even starts
#   → The iOS workflow has been using native binary + ND_MOBILE=1 successfully
#     since day one.  Same strategy works perfectly on Linux.
#
# Stage sequence: 1-idle → 2-running → 3-complete → 4-detail →
#   5-dashboard → 6-report → 7-config → 8-settings
#
# Trigger: workflow_dispatch or push to drive scripts / this file.
# =============================================================================

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/screenshot/drive-android-alt.sh'
      - '.github/workflows/screenshots-android.yml'

concurrency:
  group: screenshots-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Phone — build Linux binary → xvfb + ND_MOBILE=1 → capture
  # ═══════════════════════════════════════════════════════════════════════
  phone:
    name: Android Phone (Linux + ND_MOBILE=1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-declarative-dev libqt6quickcontrols2-6 \
            qt6-tools-dev qt6-tools-dev-tools libcurl4-openssl-dev \
            'qml6-module-*' \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-render-util0 \
            libxrandr2 libgl1 libegl1 \
            xvfb x11-utils xdotool imagemagick wmctrl openbox

      - name: Configure
        run: cmake -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE -B build -S .

      - name: Build
        run: ninja -C build net_diagnostics

      - name: Generate screenshots (xvfb + ND_MOBILE=1)
        run: |
          set -euo pipefail
          SCREEN_W=430 SCREEN_H=932 \
          ND_MOBILE=1 ND_CAPTURE_TARGET=http://localhost:8899 ND_CAPTURE_MAX_TESTS=4 \
          xvfb-run -a -s "-screen 0 430x932x24" \
            bash scripts/screenshot/drive-android-alt.sh \
            ./build/net_diagnostics resources/doc/screenshot/android/phone

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-android-phone
          path: resources/doc/screenshot/android/phone/*.png
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════
  # Tablet — wider screen, same mobile layout
  # ═══════════════════════════════════════════════════════════════════════
  tablet:
    name: Android Tablet (Linux + ND_MOBILE=1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-declarative-dev libqt6quickcontrols2-6 \
            qt6-tools-dev qt6-tools-dev-tools libcurl4-openssl-dev \
            'qml6-module-*' \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-render-util0 \
            libxrandr2 libgl1 libegl1 \
            xvfb x11-utils xdotool imagemagick wmctrl openbox

      - name: Configure
        run: cmake -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE -B build -S .

      - name: Build
        run: ninja -C build net_diagnostics

      - name: Generate screenshots (xvfb + ND_MOBILE=1, tablet size)
        run: |
          set -euo pipefail
          SCREEN_W=800 SCREEN_H=1280 \
          ND_MOBILE=1 ND_CAPTURE_TARGET=http://localhost:8899 ND_CAPTURE_MAX_TESTS=4 \
          xvfb-run -a -s "-screen 0 800x1280x24" \
            bash scripts/screenshot/drive-android-alt.sh \
            ./build/net_diagnostics resources/doc/screenshot/android/tablet

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-android-tablet
          path: resources/doc/screenshot/android/tablet/*.png
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════
  # Commit
  # ═══════════════════════════════════════════════════════════════════════
  commit:
    name: Commit screenshots
    needs: [phone, tablet]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Copy screenshots to repo
        run: |
          set -euo pipefail
          COPIED=0
          while IFS= read -r png; do
            rel="${png#artifacts/}"
            case "$rel" in
              screenshots-android-phone/*)
                dest="resources/doc/screenshot/android/phone/${rel#screenshots-android-phone/}" ;;
              screenshots-android-tablet/*)
                dest="resources/doc/screenshot/android/tablet/${rel#screenshots-android-tablet/}" ;;
              *) continue ;;
            esac
            mkdir -p "$(dirname "$dest")"
            cp -f "$png" "$dest"
            COPIED=$((COPIED + 1))
            echo "  → $dest"
          done < <(find artifacts -name '*.png' -type f 2>/dev/null || true)
          echo "Copied $COPIED screenshot(s)"

      - name: Commit and push
        env:
          GIT_AUTHOR_NAME: robinhoo1973
          GIT_AUTHOR_EMAIL: robinhoo1973@users.noreply.github.com
          GIT_COMMITTER_NAME: robinhoo1973
          GIT_COMMITTER_EMAIL: robinhoo1973@users.noreply.github.com
        run: |
          set -euo pipefail
          git add resources/doc/screenshot/android README.md README_zh_CN.md README_zh_TW.md
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit"
            exit 0
          fi
          git commit -m "docs: refresh Android screenshots via ND_MOBILE=1 CI

          Generated by screenshots-android.yml — Linux binary with ND_MOBILE=1
          renders authentic mobile layout at phone (430x932) and tablet (800x1280)
          resolutions.  Zero emulator dependency."
          git pull --rebase origin master
          git push origin master
