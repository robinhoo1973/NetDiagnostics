name: Screenshots (iOS Mobile Layout)

# Because pre-built Qt for iOS cannot link against the iPhoneSimulator SDK
# (Apple's platform-verifying linker rejects device-.o files), we build
# the production macOS native binary WITH ND_MOBILE=1 — the app then
# renders its authentic mobile layout (bottom nav, TargetInputPanel).
#
# The window is resized to iPhone proportions and driven with cliclick /
# screencapture, producing real mobile-layout screenshots without a device
# or simulator.
#
# Output: resources/doc/screenshot/ios/phone/6.5/ (canonical phone size)

on:
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * 0'

concurrency:
  group: screenshots-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  ios:
    name: iOS Mobile Layout (macOS native + ND_MOBILE=1)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          brew install cmake ninja qt@6
          brew install cliclick 2>/dev/null || true  # best-effort GUI injection

      - name: Configure
        run: |
          set -euo pipefail
          cmake -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DPROJECT_VERSION=0.0.1 \
            -DND_BUILD_NUMBER=${{ github.run_number }} \
            -DND_GIT_HASH=${{ github.sha }} \
            -DAPP_EDITION=macos-ios-mobile \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -B build -S .

      - name: Build
        run: ninja -C build net_diagnostics

      - name: Capture screenshots (mobile layout)
        run: |
          set -euo pipefail
          # 5WHY: macOS CI display may sleep/lock — caffeinate keeps the
          # session alive so screencapture gets real frames, not black.
          caffeinate -d -i -s bash scripts/screenshot/drive-ios-alt.sh \
            ./build/net_diagnostics \
            resources/doc/screenshot/ios/phone/6.5
        env:
          ND_MOBILE: "1"
          ND_MAX_TESTS: "4"
          ND_CAPTURE_TARGET: "http://localhost:8899"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-ios
          path: resources/doc/screenshot/ios/**
          if-no-files-found: error

      - name: Commit screenshots back to master
        if: success()
        run: |
          set -euo pipefail
          # Map artifact layout back to repo paths
          mkdir -p resources/doc/screenshot/ios
          cp -r resources/doc/screenshot/ios resources/doc/screenshot/ios.bak 2>/dev/null || true
          # Screenshots are already at resources/doc/screenshot/ios/ from capture
          git add resources/doc/screenshot/ios README.md README_zh_CN.md README_zh_TW.md
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh iOS screenshots via screenshot CI"
          git pull --rebase origin master
          git push origin master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
