# ═══════════════════════════════════════════════════════════════════════════
# Android Build & Deploy (reusable, parameterized)
# ═══════════════════════════════════════════════════════════════════════════
# Cross-compiles NetDiagnostics for Android with selectable arch + format:
#   input arch   = arm64 | x86_64      (Android ABI, mapped to Qt aqt arch)
#   input format = apk  | aab          (installable APK / Play App Bundle)
#   input deploy = none | google-play  (upload the arm64 AAB to Google Play)
#   input track / release_status       (Play track + release state)
#
# Called by build.yml (master caller) with an arch×format matrix, or standalone
# via workflow_dispatch.  Version is detected via the reusable version.yml.
#
# Google Play upload requires the "GooglePlay" environment holding
# GOOGLE_PLAY_SERVICE_ACCOUNT_JSON (mirrors the TestFlight environment).
# PR/fork runs have no secrets → the deploy job is skipped, the build still
# runs as a validation artifact signed with the debug keystore.
#
# NOTE: no top-level concurrency here — build.yml (the master caller) owns
# cancellation.  A per-ref concurrency key here would cancel sibling matrix
# calls of this same reusable workflow.
# ═══════════════════════════════════════════════════════════════════════════
name: Android Build & Deploy

on:
  workflow_call:
    inputs:
      arch:
        description: Android ABI (arm64 | x86_64)
        type: string
        required: true
      format:
        description: Package format (apk | aab)
        type: string
        required: true
      deploy:
        description: Upload target (none | google-play)
        type: string
        required: false
        default: none
      track:
        description: Google Play track (internal | alpha | beta | production)
        type: string
        required: false
        default: internal
      release_status:
        description: Google Play release status (completed | inProgress | draft)
        type: string
        required: false
        default: completed
    secrets:
      ND_KEYSTORE_B64:
        required: false
      ND_KEYSTORE_PASS:
        required: false
      ND_KEY_ALIAS:
        required: false
      ND_KEY_PASS:
        required: false
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        required: false
  workflow_dispatch:
    inputs:
      arch:
        description: Android ABI
        type: choice
        options:
          - arm64
          - x86_64
        default: arm64
      format:
        description: Package format
        type: choice
        options:
          - apk
          - aab
        default: apk
      deploy:
        description: Upload target
        type: choice
        options:
          - none
          - google-play
        default: none
      track:
        description: Google Play track
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal
      release_status:
        description: Google Play release status
        type: choice
        options:
          - completed
          - inProgress
          - draft
        default: completed

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  # 5WHY: Qt 6.5.3 for Android — HIGHEST open-source 6.5.x via aqtinstall.
  # Qt 6.6+ bumped AGP version which conflicts with compileSdk 33 / aapt2.
  # 6.5.x keeps AGP 7.4.1.  Target: converge to 6.8.x once Android SDK 34+
  # aapt2 compatibility is verified.
  QT_VERSION_ANDROID: 6.5.3
  ANDROID_API_LEVEL: "26"
  PACKAGE_NAME: "com.netdiagnostic.app"
  APP_NAME: "NetDiagnostics"

jobs:
  version:
    name: Detect Version
    uses: ./.github/workflows/version.yml

  # ── Android build (arch × format) ──────────────────────────────────────
  android:
    name: Android ${{ inputs.arch }} (${{ inputs.format }})
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Map the friendly input to the Qt aqt arch name and Android ABI.
      QT_ANDROID_ARCH: ${{ inputs.arch == 'x86_64' && 'android_x86_64' || 'android_arm64_v8a' }}
      ANDROID_ABI: ${{ inputs.arch == 'x86_64' && 'x86_64' || 'arm64-v8a' }}
      APP_EDITION: android-${{ inputs.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build
          # 5WHY: pip install without --break-system-packages fails on
          # Ubuntu 24.04+ (PEP 668 externally-managed-environment).
          # Use a venv for isolation, same pattern as the other workflows.
          python3 -m venv /tmp/venv && source /tmp/venv/bin/activate && pip install aqtinstall
          echo "/tmp/venv/bin" >> "$GITHUB_PATH"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Qt6 desktop (host tools)
        id: cache-qt-desktop
        uses: actions/cache@v4
        with:
          path: /opt/qt-desktop
          key: qt6-android-desktop-${{ env.QT_VERSION_ANDROID }}-v1

      - name: Install Qt6 desktop via aqt
        if: steps.cache-qt-desktop.outputs.cache-hit != 'true'
        run: |
          aqt install-qt linux desktop $QT_VERSION_ANDROID gcc_64 -O /opt/qt-desktop

      - name: Cache Qt6 Android ${{ inputs.arch }}
        id: cache-qt-android
        uses: actions/cache@v4
        with:
          path: /opt/qt-android-${{ inputs.arch }}
          key: qt6-android-${{ inputs.arch }}-${{ env.QT_VERSION_ANDROID }}-v1

      - name: Install Qt6 for Android via aqt
        if: steps.cache-qt-android.outputs.cache-hit != 'true'
        run: |
          aqt install-qt linux android $QT_VERSION_ANDROID $QT_ANDROID_ARCH -O /opt/qt-android-${{ inputs.arch }}

      - name: Configure
        run: |
          echo "[Android ${{ inputs.arch }}] Configuring..."
          cmake -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DPROJECT_VERSION="${{ needs.version.outputs.pkg_version }}" \
            -DND_PRERELEASE="${{ needs.version.outputs.pkg_prerelease }}" \
            -DND_BUILD_NUMBER=${{ github.run_number }} \
            -DND_GIT_HASH=${{ github.sha }} \
            -DAPP_EDITION=$APP_EDITION \
            -DCMAKE_PREFIX_PATH="/opt/qt-android-${{ inputs.arch }}/$QT_VERSION_ANDROID/$QT_ANDROID_ARCH" \
            -DQT_HOST_PATH="/opt/qt-desktop/$QT_VERSION_ANDROID/gcc_64" \
            -DCMAKE_FIND_ROOT_PATH="/opt/qt-android-${{ inputs.arch }}/$QT_VERSION_ANDROID/$QT_ANDROID_ARCH" \
            -DANDROID_SDK_ROOT=$ANDROID_SDK_ROOT \
            -DANDROID_NDK_ROOT=$ANDROID_NDK_ROOT \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ANDROID_ABI \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API_LEVEL }} \
            -B build -S .

      - name: Build
        run: |
          ninja -C build net_diagnostics

      - name: Build APK
        if: inputs.format == 'apk'
        uses: ./.github/actions/android-apk
        with:
          qt_version: ${{ env.QT_VERSION_ANDROID }}
          output_name: NetDiagnostics-Android-${{ inputs.arch }}.apk
          build_dir: build
        env:
          # 5WHY: pass secrets via env, NOT with: inputs.  GitHub reliably
          # masks env values derived from secrets; composite-action `with:`
          # inputs are inlined into the script text where masking is not
          # guaranteed.  Every release build shares ONE signing key so
          # upgrades install cleanly; empty on PR/fork -> debug fallback.
          ND_KEYSTORE_B64: ${{ secrets.ND_KEYSTORE_B64 }}
          ND_KEYSTORE_PASS: ${{ secrets.ND_KEYSTORE_PASS }}
          ND_KEY_ALIAS: ${{ secrets.ND_KEY_ALIAS }}
          ND_KEY_PASS: ${{ secrets.ND_KEY_PASS }}

      - name: Build AAB
        if: inputs.format == 'aab'
        uses: ./.github/actions/android-aab
        with:
          qt_version: ${{ env.QT_VERSION_ANDROID }}
          output_name: NetDiagnostics-Android-${{ inputs.arch }}.aab
          build_dir: build
        env:
          # 5WHY: pass secrets via env, NOT with: inputs (see APK above).
          # Every Play upload shares ONE upload key so Play App Signing
          # upgrades install cleanly.
          ND_KEYSTORE_B64: ${{ secrets.ND_KEYSTORE_B64 }}
          ND_KEYSTORE_PASS: ${{ secrets.ND_KEYSTORE_PASS }}
          ND_KEY_ALIAS: ${{ secrets.ND_KEY_ALIAS }}
          ND_KEY_PASS: ${{ secrets.ND_KEY_PASS }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetDiagnostics-Android-${{ inputs.arch }}${{ inputs.format == 'aab' && '-aab' || '' }}
          path: |
            NetDiagnostics-Android-${{ inputs.arch }}.${{ inputs.format }}
          if-no-files-found: error

  # ── Deploy to Google Play ──────────────────────────────────────────────
  # Only the arm64 AAB cell carries deploy=google-play.  The Play service
  # account is checked in a step below — the `secrets` context is NOT
  # available in job-level `if`, so PR/fork runs (no secrets) skip the
  # upload with a warning instead of failing the pipeline.
  deploy-google-play:
    name: Deploy Android to Google Play
    needs: [version, android]
    if: ${{ inputs.deploy == 'google-play' && inputs.format == 'aab' && inputs.arch == 'arm64' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 5WHY: mirror the TestFlight environment pattern — environment-scoped
    # secrets keep the Play service account out of the default repo secret
    # namespace and give the deploy a visible approval gate if the user adds
    # one to the "GooglePlay" environment.
    environment: GooglePlay

    steps:
      - name: Check Play credentials
        id: check
        env:
          PLAY_SA_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SA_JSON" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not set — skipping Google Play upload"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: NetDiagnostics-Android-arm64-aab

      - name: Check if already uploaded
        id: dedup
        uses: actions/cache/restore@v4
        with:
          path: .googleplay-sha
          key: google-play-${{ inputs.track }}-${{ runner.os }}-v1
      - name: Read last uploaded SHA
        id: last-sha
        run: |
          if [ -f .googleplay-sha/version ]; then echo "last=$(cat .googleplay-sha/version)" >> "$GITHUB_OUTPUT"
          else echo "last=none" >> "$GITHUB_OUTPUT"; fi
          echo "current=${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Report dedup status
        run: |
          if [ "${{ steps.last-sha.outputs.last }}" = "${{ github.sha }}" ]; then
            echo "[SKIP] Same commit already uploaded"; fi

      - name: Resolve track + status
        id: track
        run: |
          TRACK="${{ inputs.track }}"
          STATUS="${{ inputs.release_status }}"
          echo "track=${TRACK}" >> "$GITHUB_OUTPUT"
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "Play track: ${TRACK} (status: ${STATUS})"

      - name: Verify Play version code
        run: |
          # 5WHY: mirror netdiag-target.cmake's versionCode scheme
          # (M*1e6 + m*1e3 + p)*10 + (1 pre-release / 2 final).  Google Play
          # rejects duplicate or decreasing versionCodes per track.  The AAB
          # already carries this versionCode (baked in by the manifest
          # generation); r0adkll/upload-google-play reads it from the file
          # itself, so this step only cross-checks the expected value in the
          # CI log and fails fast if version detection produced garbage.
          V="${{ needs.version.outputs.pkg_version }}"
          [ -n "$V" ] || { echo "ERROR: empty pkg_version — is there a v* tag?"; exit 1; }
          IFS=. read -r M m p <<< "$V"
          PRE="${{ needs.version.outputs.pkg_prerelease }}"
          EXTRA=2
          [ -n "$PRE" ] && EXTRA=1
          VC=$(( (M*1000000 + m*1000 + p)*10 + EXTRA ))
          echo "Expected Play versionCode: ${VC} (${M}.${m}.${p}${PRE:+-$PRE})"

      - name: Upload to Google Play
        if: steps.check.outputs.ok == 'true' && steps.last-sha.outputs.last != github.sha
        uses: r0adkll/upload-google-play@v1
        with:
          # 5WHY: r0adkll/upload-google-play is the de-facto standard action
          # for the Play Developer API (uploads .apk/.aab to any track).
          # serviceAccountJsonPlainText avoids writing the secret to disk;
          # releaseFiles accepts the AAB glob; version codes are read from
          # the AAB itself by the action.
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: NetDiagnostics-Android-arm64.aab
          track: ${{ steps.track.outputs.track }}
          status: ${{ steps.track.outputs.status }}
          changesNotSentForReview: false

      - name: Save uploaded SHA
        if: always() && steps.check.outputs.ok == 'true'
        run: |
          mkdir -p .googleplay-sha
          echo "${{ github.sha }}" > .googleplay-sha/version
      - uses: actions/cache/save@v4
        if: always() && steps.check.outputs.ok == 'true'
        with:
          path: .googleplay-sha
          key: google-play-${{ inputs.track }}-${{ runner.os }}-v1
