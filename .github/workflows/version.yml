# ═══════════════════════════════════════════════════════════════════════════
# Reusable Version Detection Workflow
# ═══════════════════════════════════════════════════════════════════════════
# 5WHY: Version detection was copy-pasted across build.yml, macos.yml, ios.yml,
# and test.yml (4 identical copies).  Centralizing it here ensures consistent
# semver tag → CMake version mapping across all pipelines, and a fix here
# propagates everywhere.  Callers reference this via:
#   jobs:
#     version:
#       uses: ./.github/workflows/version.yml
#     build:
#       needs: [version]
#       env:
#         PKG_VERSION: ${{ needs.version.outputs.pkg_version }}
# ═══════════════════════════════════════════════════════════════════════════

name: Version

on:
  workflow_call:
    outputs:
      pkg_version:
        description: Semver version parsed from latest git tag, pre-release suffix stripped (e.g. 1.2.3 from v1.2.3 or v1.2.3-rc1)
        value: ${{ jobs.version.outputs.pkg_version }}
      pkg_prerelease:
        description: Pre-release suffix of the latest tag (e.g. rc1), empty for a final release
        value: ${{ jobs.version.outputs.pkg_prerelease }}
      build_number:
        # 5WHY (TestFlight): App Store Connect requires a monotonically
        # increasing build number per app, and TestFlight shares the build
        # number namespace with App Store release builds.  Offset by +300
        # above the official GitHub run number so the TestFlight range never
        # collides with release builds.
        description: TestFlight build number = official run number + 300
        value: ${{ jobs.version.outputs.build_number }}

jobs:
  version:
    name: Detect Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pkg_version: ${{ steps.v.outputs.pkg_version }}
      pkg_prerelease: ${{ steps.v.outputs.pkg_prerelease }}
      build_number: ${{ steps.v.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: v
        run: |
          # 5WHY: git tag --list finds tags globally across all branches.  A
          # tag on a feature branch with a higher version would be incorrectly
          # selected.  git describe --tags --abbrev=0 returns the NEAREST
          # version tag ancestor of HEAD — the standard "what version is this
          # commit" answer — so the detected version matches this checkout.
          #
          # 5WHY (pre-release tags): --sort=-version:refname mis-orders
          # pre-releases (git ranks v0.0.4-rc2 > v0.0.4, the opposite of
          # semver), and a plain `grep -v '-'` silently dropped pre-release
          # tags, falling back to 0.0.1.  git describe handles v0.0.4-rcN
          # naturally; we split off the suffix so desktop packaging gets a
          # clean M.m.p while Android still learns the pre-release marker.
          LATEST=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          if [ -z "$LATEST" ]; then
            echo "pkg_version=0.0.1" >> "$GITHUB_OUTPUT"
            echo "pkg_prerelease=" >> "$GITHUB_OUTPUT"
          else
            RAW="${LATEST#v}"
            # Strip git describe's "<tag>-<n>-g<sha>" (HEAD past the tag): that
            # is NOT a semver pre-release, just describe's commit-distance suffix.
            case "$RAW" in
              *-*-g*) RAW="${RAW%%-*-g*}" ;;
            esac
            # Split off a real pre-release suffix: 0.0.4-rc1 -> base=0.0.4, pre=rc1
            BASE="${RAW%%-*}"
            PRERELEASE="${RAW#"$BASE"}"
            PRERELEASE="${PRERELEASE#-}"
            echo "pkg_version=${BASE}" >> "$GITHUB_OUTPUT"
            echo "pkg_prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          fi
          # 5WHY (TestFlight): App Store Connect build numbers must increase
          # monotonically per app and are shared between TestFlight and App
          # Store release builds.  Adding +300 to the official run number
          # gives the TestFlight pipeline a dedicated range that never
          # collides with release builds.
          echo "build_number=$(( GITHUB_RUN_NUMBER + 300 ))" >> "$GITHUB_OUTPUT"
          echo "Version: $(grep -oP 'pkg_version=\K.*' "$GITHUB_OUTPUT" | head -1)${PRERELEASE:+ (pre-release: ${PRERELEASE})} / build_number=$(( GITHUB_RUN_NUMBER + 300 ))"
