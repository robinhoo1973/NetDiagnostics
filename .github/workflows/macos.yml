# ═══════════════════════════════════════════════════════════════════════════
# macOS Build & Package (reusable, dual-mode)
# ═══════════════════════════════════════════════════════════════════════════
#   mode = release    (default) → build .app + ad-hoc sign → DMG / tar.gz
#                                 (Release-download artifacts, NetDiagnostics-macOS-release)
#   mode = testflight            → build .app + macdeployqt → share the .app
#                                 (NetDiagnostics-macOS-app, consumed by testflight.yml)
#
# build.yml (master caller) invokes mode=release for the GitHub Release page.
# apple.yml invokes mode=testflight as the macOS build leg of its parallel
# TestFlight pipeline (upload handled by testflight.yml platform=macos).
#
# Version/build inputs are optional — when provided they override version.yml
# (apple.yml passes the +300 TestFlight build number); standalone dispatch
# falls back to version.yml + run metadata.
#
# NOTE: no top-level concurrency here — the caller owns cancellation.
# ═══════════════════════════════════════════════════════════════════════════
name: macOS Build & Package

on:
  workflow_call:
    inputs:
      mode:
        description: release (DMG/tar.gz download) | testflight (.app for upload)
        type: string
        required: false
        default: release
      pkg_version:
        description: Release version (M.m.p) — overrides version.yml when set
        type: string
        required: false
      pkg_prerelease:
        description: Pre-release suffix (e.g. rc1)
        type: string
        required: false
        default: ''
      build_number:
        description: TestFlight build number (official run number + 300)
        type: string
        required: false
      git_hash:
        description: Commit SHA
        type: string
        required: false
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode
        type: choice
        options:
          - release
          - testflight
        default: release

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  QT_VERSION: 6.8.3
  MAINTAINER: "robinhoo1973"

jobs:
  version:
    name: Detect Version
    uses: ./.github/workflows/version.yml

  macos:
    name: macOS arm64 (${{ inputs.mode }})
    needs: [version]
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Resolve version/build inputs — workflow_call overrides, standalone
      # dispatch falls back to version.yml + run metadata.
      PKG_VERSION: ${{ inputs.pkg_version || needs.version.outputs.pkg_version }}
      PKG_PRERELEASE: ${{ inputs.pkg_prerelease || needs.version.outputs.pkg_prerelease }}
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
      GIT_HASH: ${{ inputs.git_hash || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja qt@6

      - uses: ./.github/actions/macos-icon

      - name: Configure (production)
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DPROJECT_VERSION="$PKG_VERSION" \
            -DND_BUILD_NUMBER=$BUILD_NUMBER \
            -DND_GIT_HASH=$GIT_HASH \
            -DAPP_EDITION=macos-arm64 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)" \
            -B build -S .

      - name: Build (production)
        run: ninja -C build net_diagnostics

      - name: Bundle Qt frameworks (macdeployqt)
        run: |
          set -euo pipefail
          # 5WHY: added pipefail — POSIX pipelines only report the last
          # command's exit code.  Without it, "cmd 2>&1 | tail" masks
          # failures because tail always exits 0.
          if [ -d build/net_diagnostics.app ]; then
            QT_PREFIX="$(brew --prefix qt@6)"
            MACDEPLOY_LOG=$(mktemp)
            set +e
            "${QT_PREFIX}/bin/macdeployqt" build/net_diagnostics.app \
              -qmldir="${GITHUB_WORKSPACE}/src" -verbose=1 >"$MACDEPLOY_LOG" 2>&1
            MACDEPLOY_EXIT=$?
            set -e
            tail -40 "$MACDEPLOY_LOG"
            if [ $MACDEPLOY_EXIT -ne 0 ]; then
              if grep -qE "(ERROR.*rpath|ERROR: Could not find any external Qt|WARNING: Could not find any)" "$MACDEPLOY_LOG"; then
                echo "[INFO] macdeployqt exited $MACDEPLOY_EXIT — known non-fatal"
              else
                echo "[FAIL] macdeployqt failed"; rm -f "$MACDEPLOY_LOG"; exit 1
              fi
            fi
            rm -f "$MACDEPLOY_LOG"
            if [ -d build/net_diagnostics.app/Contents/Frameworks ]; then
              FW_COUNT=$(find build/net_diagnostics.app/Contents/Frameworks -maxdepth 1 -not -name Frameworks | wc -l | tr -d ' ')
              echo "[OK] Qt frameworks bundled (${FW_COUNT} entries)"; ls -la build/net_diagnostics.app/Contents/Frameworks/
            fi
          else
            echo "[WARN] No .app bundle found; skipping macdeployqt"
          fi

      # ═══ testflight mode: share the .app for testflight.yml (macos) ═══
      - name: Tar .app (TestFlight)
        if: inputs.mode == 'testflight'
        run: tar -czf NetDiagnostics-macOS.app.tar.gz -C build net_diagnostics.app

      - name: Upload .app artifact (TestFlight)
        if: inputs.mode == 'testflight'
        uses: actions/upload-artifact@v4
        with:
          name: NetDiagnostics-macOS-app
          path: NetDiagnostics-macOS.app.tar.gz
          if-no-files-found: error

      # ═══ release mode: ad-hoc sign → DMG / tar.gz download format ═══
      - name: Ad-hoc code sign (DMG artifact)
        if: inputs.mode != 'testflight'
        run: |
          set -euo pipefail
          APP=build/net_diagnostics.app
          if [ -d "$APP/Contents/Frameworks" ]; then
            find "$APP/Contents/Frameworks" -name "*.framework" -type d | while read fw; do
              codesign --force --sign - "$fw" || { echo "[FAIL] codesign $fw"; exit 1; }
            done
          fi
          BIN="$APP/Contents/MacOS/net_diagnostics"
          [ -f "$BIN" ] && codesign --force --sign - "$BIN"
          codesign --force --sign - "$APP"
          echo "[OK] .app ad-hoc signed"

      - name: Package DMG
        if: inputs.mode != 'testflight'
        continue-on-error: true
        run: |
          rm -rf dmg-staging; mkdir -p dmg-staging
          cp -R build/net_diagnostics.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "NetDiagnostics" -srcfolder dmg-staging -ov -format UDZO NetDiagnostics-macOS-arm64.dmg
          ls -lh NetDiagnostics-macOS-arm64.dmg

      - name: Tar .app (release download)
        if: inputs.mode != 'testflight'
        run: tar -czf NetDiagnostics-macOS-arm64.tar.gz -C build net_diagnostics.app

      - name: Upload release artifacts
        if: inputs.mode != 'testflight'
        uses: actions/upload-artifact@v4
        with:
          name: NetDiagnostics-macOS-release
          path: |
            NetDiagnostics-macOS-arm64.dmg
            NetDiagnostics-macOS-arm64.tar.gz
          if-no-files-found: error
