<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" fill-opacity="0">
  <defs>
    <!-- Gradient: primary (#0C4A6E) → dark-end (#08344D) — baked at generation -->
    <linearGradient id="pingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C4A6E" />
      <stop offset="100%" stop-color="#08344D" />
    </linearGradient>
  </defs>

  <!-- Outer radar arc — gradient stroke (primary → dark) -->
  <path d="M19.07 4.93A10 10 0 0 0 6.99 3.34"
        stroke="url(#pingGrad)" stroke-width="2.5" />
  <path d="M2.29 9.62A10 10 0 1 0 21.31 8.35"
        stroke="url(#pingGrad)" stroke-width="2.5" />

  <!-- Middle arc — accent color (#0EA5E9 → #0EA5E9 cyan at generation) -->
  <path d="M16.24 7.76A6 6 0 1 0 8.23 16.67"
        stroke="#0EA5E9" stroke-width="2.5" />

  <!-- Ping endpoint dots — soft fill (#64748B) as subtle glow -->
  <circle cx="12" cy="12" r="2" fill="#64748B" fill-opacity="1" />
  <circle cx="12" cy="12" r="2" stroke="url(#pingGrad)" stroke-width="2.5" />

  <!-- Directional arrow — accent highlight -->
  <path d="m13.41 10.59 5.66-5.66" stroke="#0EA5E9" stroke-width="2.5" />

  <!-- Micro details — primary -->
  <path d="M4 6h.01" stroke="#0C4A6E" stroke-width="2.5" />
  <path d="M12 18h.01" stroke="#0C4A6E" stroke-width="2.5" />
  <path d="M17.99 11.66A6 6 0 0 1 15.77 16.67"
        stroke="url(#pingGrad)" stroke-width="2.5" />
</svg>
