<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" fill-opacity="0">
  <defs>
    <linearGradient id="cpuGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#AAAAAA" />
    </linearGradient>
  </defs>
  <!-- Chip body — gradient stroke + soft fill -->
  <rect x="4" y="4" width="16" height="16" rx="2" fill="#777777" stroke="url(#cpuGrad)" stroke-width="2.5" />
  <!-- Die — accent -->
  <rect x="9" y="9" width="6" height="6" rx="1" stroke="#000000" stroke-width="2" fill="none" />
  <!-- Pins — primary -->
  <line x1="9" y1="1" x2="9" y2="4" stroke="#FFFFFF" stroke-width="2.5" />
  <line x1="15" y1="1" x2="15" y2="4" stroke="#FFFFFF" stroke-width="2.5" />
  <line x1="9" y1="20" x2="9" y2="23" stroke="#FFFFFF" stroke-width="2.5" />
  <line x1="15" y1="20" x2="15" y2="23" stroke="#FFFFFF" stroke-width="2.5" />
  <line x1="1" y1="9" x2="4" y2="9" stroke="#FFFFFF" stroke-width="2.5" />
  <line x1="1" y1="15" x2="4" y2="15" stroke="#FFFFFF" stroke-width="2.5" />
  <line x1="20" y1="9" x2="23" y2="9" stroke="#FFFFFF" stroke-width="2.5" />
  <line x1="20" y1="15" x2="23" y2="15" stroke="#FFFFFF" stroke-width="2.5" />
</svg>
