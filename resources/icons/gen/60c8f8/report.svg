<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" fill-opacity="0" stroke="#60C8F8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- 5WHY: Qt's QSvgRenderer does not reliably render <text> elements (font
       resolution is platform-dependent and often silently skipped) - the
       same defect fixed in file-pdf.svg/file-html.svg was missed here. The
       "RPT" label never rendered at runtime. Removed rather than converted
       to stroke paths: the document + two text-lines shape is already the
       standard, unambiguous "report/file-text" glyph and needs no letters. -->
