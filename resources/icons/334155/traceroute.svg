<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" fill-opacity="0">
  <defs>
    <linearGradient id="trGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#242D3B" />
    </linearGradient>
  </defs>
  <!-- Start/end nodes — accent -->
  <circle cx="4" cy="12" r="2" fill="#0EA5E9" fill-opacity="1" />
  <circle cx="20" cy="12" r="2" fill="#0EA5E9" fill-opacity="1" />
  <!-- Hop nodes — gradient -->
  <circle cx="8" cy="7" r="1.5" stroke="url(#trGrad)" stroke-width="2" />
  <circle cx="12" cy="17" r="1.5" stroke="url(#trGrad)" stroke-width="2" />
  <circle cx="16" cy="9" r="1.5" stroke="url(#trGrad)" stroke-width="2" />
  <!-- Connecting lines — primary -->
  <line x1="5.5" y1="11" x2="7" y2="8" stroke="#334155" stroke-width="2" />
  <line x1="9" y1="8" x2="11" y2="15.5" stroke="#334155" stroke-width="2" />
  <line x1="13" y1="16" x2="15" y2="10" stroke="#334155" stroke-width="2" />
  <line x1="17" y1="10" x2="18.5" y2="11.5" stroke="#334155" stroke-width="2" />
  <!-- Soft shadow rings at hops -->
  <circle cx="8" cy="7" r="3.5" fill="#64748B" fill-opacity="1" opacity="0.25" />
  <circle cx="12" cy="17" r="3.5" fill="#64748B" fill-opacity="1" opacity="0.25" />
  <circle cx="16" cy="9" r="3.5" fill="#64748B" fill-opacity="1" opacity="0.25" />
</svg>
