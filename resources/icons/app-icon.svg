<?xml version="1.0" encoding="UTF-8"?>
<!--
  NetDiagnostics — application icon (vector master)

  Concept: a modern "network diagnostics" mark — a deep-blue squircle
  tile with a soft radial glow, overlaid with an abstract network of
  connected nodes forming a subtle radar-sweep motif, and a sweeping
  cyan measurement arc.

  Palette (matches ThemeEngine / Palette.js brand):
    tile gradient : #0B2447 → #0C4A6E → #0EA5E9
    node cyan     : #68E5F4 / #06B6D4
    accent dot    : #F43F5E

  Rasterize to netanalysis.png / netanalysis.ico with:
    python3 -m cairosvg app-icon.svg -o out.png -w 1024 -h 1024
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2447"/>
      <stop offset="0.55" stop-color="#0C4A6E"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="node" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#F0FDFF"/>
      <stop offset="0.5" stop-color="#68E5F4"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </radialGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#68E5F4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="216" ry="216" fill="url(#tile)"/>
  <rect x="32" y="32" width="960" height="480" rx="216" ry="216" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="512" cy="512" r="380" fill="url(#glow)"/>

  <g stroke="url(#link)" stroke-width="30" stroke-linecap="round" fill="none">
    <line x1="512" y1="352" x2="512" y2="656"/>
    <line x1="512" y1="352" x2="356" y2="600"/>
    <line x1="512" y1="352" x2="668" y2="600"/>
    <line x1="356" y1="600" x2="276" y2="500"/>
    <line x1="668" y1="600" x2="748" y2="500"/>
    <line x1="356" y1="600" x2="512" y2="656"/>
    <line x1="668" y1="600" x2="512" y2="656"/>
  </g>

  <path d="M 348 724 A 340 340 0 0 1 676 724" fill="none"
        stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" opacity="0.85"/>
  <path d="M 392 700 A 296 296 0 0 1 632 700" fill="none"
        stroke="#06B6D4" stroke-width="14" stroke-linecap="round" opacity="0.9"/>

  <g fill="url(#node)">
    <circle cx="512" cy="352" r="62"/>
    <circle cx="356" cy="600" r="48"/>
    <circle cx="668" cy="600" r="48"/>
    <circle cx="276" cy="500" r="38"/>
    <circle cx="748" cy="500" r="38"/>
  </g>
  <circle cx="512" cy="352" r="24" fill="#F43F5E"/>
  <circle cx="512" cy="352" r="40" fill="none" stroke="#F43F5E" stroke-width="10" opacity="0.45"/>
</svg>
